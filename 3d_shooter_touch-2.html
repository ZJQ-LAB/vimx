<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>3D 触屏射击游戏</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    width: 100%; height: 100%;
    background: #000;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  #gameCanvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
  }
  #crosshair {
    position: absolute; top: 50%; left: 50%;
    width: 24px; height: 24px; transform: translate(-50%, -50%);
  }
  #crosshair:before, #crosshair:after {
    content: ''; position: absolute; background: rgba(0,255,120,0.85);
    transition: background 0.08s;
  }
  #crosshair:before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
  #crosshair:after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
  #crosshair.hit:before, #crosshair.hit:after { background: #ff2d2d; }
  #crosshair.hit { transform: translate(-50%, -50%) scale(1.4); }

  #hitMarker {
    position: absolute; top: 50%; left: 50%; width: 34px; height: 34px;
    transform: translate(-50%,-50%); pointer-events: none; opacity: 0;
  }
  #hitMarker.show { animation: hitmarkerPop 0.25s ease-out; }
  #hitMarker:before, #hitMarker:after {
    content: ''; position: absolute; width: 100%; height: 3px; background: #ff2d2d;
    top: 50%; left: 0; transform-origin: center;
  }
  #hitMarker:before { transform: translateY(-50%) rotate(45deg); }
  #hitMarker:after { transform: translateY(-50%) rotate(-45deg); }
  @keyframes hitmarkerPop {
    0% { opacity: 1; transform: translate(-50%,-50%) scale(0.6); }
    40% { opacity: 1; transform: translate(-50%,-50%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1.3); }
  }

  #controlHud {
    position: absolute; top: 44px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px;
  }
  .cpIcon {
    width: 20px; height: 20px; border-radius: 50%; overflow: hidden;
    border: 2px solid rgba(255,255,255,0.7); background: #777; position: relative;
  }
  .cpIcon .fill {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 0%;
    background: #3a7bd5; transition: height 0.3s, background 0.3s;
  }
  #captureStatus {
    position: absolute; bottom: 300px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 13px; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    background: rgba(0,0,0,0.4); padding: 4px 12px; border-radius: 10px; display: none;
  }
  #respawnMsg {
    position: absolute; top: 42%; left: 50%; transform: translate(-50%,-50%);
    color: #fff; font-size: 22px; font-weight: bold; text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    background: rgba(0,0,0,0.45); padding: 14px 26px; border-radius: 12px;
    opacity: 0; pointer-events: none; transition: opacity 0.4s;
  }
  #commandBtn {
    position: absolute; top: 54px; left: 14px; width: 56px; height: 56px;
    border-radius: 50%; background: rgba(255,180,60,0.35);
    border: 2px solid rgba(255,255,255,0.55); color:#fff; font-size:11px; font-weight:bold;
    display:flex; align-items:center; justify-content:center; text-align:center;
    pointer-events: auto; z-index: 25;
  }
  #commandBtn.active { background: rgba(255,180,60,0.7); }
  #rallyMsg {
    position: absolute; top: 30%; left: 50%; transform: translate(-50%,-50%);
    color: #ffcf6b; font-size: 16px; font-weight: bold; text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    background: rgba(0,0,0,0.45); padding: 8px 18px; border-radius: 10px;
    opacity: 0; pointer-events: none; transition: opacity 0.35s;
  }

  #topBar {
    position: absolute; top: 10px; left: 0; width: 100%;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 14px; box-sizing: border-box;
    color: #fff; font-size: 15px; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  #casualtyText {
    position: absolute; top: 32px; left: 14px;
    color: #ff9a8a; font-size: 12px; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  #holdTimerText {
    position: absolute; top: 52px; left: 14px;
    color: #ffd76b; font-size: 13px; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    display: none;
  }
  #healthWrap {
    width: 130px; height: 14px; background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.5); border-radius: 7px; overflow: hidden;
  }
  #healthBar {
    height: 100%; width: 100%; background: linear-gradient(90deg,#ff4d4d,#ff8a4d);
    transition: width 0.2s;
  }
  #ammoText { font-size: 15px; font-weight: bold; min-width: 90px; text-align: right; }
  #scoreText { font-size: 15px; font-weight: bold; }

  #hitFlash {
    position: absolute; top:0; left:0; width:100%; height:100%;
    background: rgba(255,0,0,0.35); opacity: 0; pointer-events:none;
    transition: opacity 0.15s;
  }

  #victoryBlackout {
    position: fixed; top:0; left:0; width:100%; height:100%;
    background: #000; opacity: 0; pointer-events: none;
    transition: opacity 1.5s ease; z-index: 90;
  }
  #victoryText {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 82%; max-width: 640px; text-align: center;
    color: #ff3b3b; font-size: 78px; font-weight: bold; letter-spacing: 6px;
    text-shadow: 0 3px 16px rgba(0,0,0,0.9);
    opacity: 0; pointer-events: none; transition: opacity 0.8s ease;
    z-index: 91;
  }
  #victoryText.sub-style {
    color: #fff; font-size: 27px; font-weight: normal; letter-spacing: 1px; line-height: 1.75;
  }

  #joystickZone {
    position: absolute; left: 0; bottom: 0; width: 45%; height: 55%;
    pointer-events: auto;
  }
  #joystickBase {
    position: absolute; width: 100px; height: 100px; border-radius: 50%;
    background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.4);
    display: none;
  }
  #joystickStick {
    position: absolute; width: 46px; height: 46px; border-radius: 50%;
    background: rgba(255,255,255,0.55); top: 27px; left: 27px;
  }

  #lookZone {
    position: absolute; right: 0; bottom: 0; width: 55%; height: 100%;
    pointer-events: auto;
  }

  #fireBtn {
    position: absolute; right: 26px; bottom: 150px; width: 84px; height: 84px;
    border-radius: 50%; background: rgba(255,60,60,0.55);
    border: 2px solid rgba(255,255,255,0.6); color:#fff; font-size:14px; font-weight:bold;
    display:flex; align-items:center; justify-content:center;
    pointer-events: auto; z-index: 20;
  }
  #fireBtn.active { background: rgba(255,60,60,0.9); transform: scale(0.95); }

  #jumpBtn {
    position: absolute; right: 130px; bottom: 26px; width: 56px; height: 56px;
    border-radius: 50%; background: rgba(255,255,255,0.2);
    border: 2px solid rgba(255,255,255,0.5); color:#fff; font-size:12px; font-weight:bold;
    display:flex; align-items:center; justify-content:center;
    pointer-events: auto; z-index: 20;
  }

  #reloadBtn {
    position: absolute; top: 54px; right: 14px; width: 56px; height: 56px;
    border-radius: 50%; background: rgba(80,160,255,0.35);
    border: 2px solid rgba(255,255,255,0.55); color:#fff; font-size:12px; font-weight:bold;
    display:flex; align-items:center; justify-content:center;
    pointer-events: auto; z-index: 25;
  }
  #weaponBtn {
    position: absolute; top: 118px; right: 14px; width: 56px; height: 56px;
    border-radius: 50%; background: rgba(255,200,60,0.35);
    border: 2px solid rgba(255,255,255,0.55); color:#fff; font-size:11px; font-weight:bold;
    display:flex; align-items:center; justify-content:center; text-align:center;
    pointer-events: auto; z-index: 25;
  }

  #reloadHint {
    position: absolute; bottom: 210px; right: 26px; color:#ffcf4d;
    font-size: 13px; font-weight:bold; text-shadow:0 1px 3px rgba(0,0,0,0.8);
    display:none;
  }

  #aimBtn {
    position: absolute; right: 26px; bottom: 26px; width: 56px; height: 56px;
    border-radius: 50%; background: rgba(255,255,255,0.2);
    border: 2px solid rgba(255,255,255,0.5); color:#fff; font-size:12px; font-weight:bold;
    display:flex; align-items:center; justify-content:center;
    pointer-events: auto; z-index: 20;
  }
  #aimBtn.active { background: rgba(120,255,150,0.5); }

  #vehicleBtn {
    position: absolute; left: 50%; bottom: 140px; transform: translateX(-50%); // 移下来，不与准心重合
    padding: 10px 22px; border-radius: 22px; background: rgba(0,0,0,0.55);
    border: 2px solid rgba(255,255,255,0.6); color:#fff; font-size:14px; font-weight:bold;
    pointer-events: auto; z-index: 25; display: none;
  }

  #scopeOverlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 15; display: none;
  }
  #scopeOverlay.show {
    display: block;
    background: radial-gradient(circle at center, transparent 0 27%, #000 29% 100%);
  }
  #scopeOverlay:before, #scopeOverlay:after {
    content: ''; position: absolute; top: 50%; left: 50%; background: rgba(0,0,0,0.85);
  }
  #scopeOverlay:before { width: 1px; height: 100%; transform: translate(-50%,-50%); }
  #scopeOverlay:after { height: 1px; width: 100%; transform: translate(-50%,-50%); }

  #loading {
    position: fixed; top:0; left:0; width:100%; height:100%; background:#000;
    color:#0f8; display:flex; align-items:center; justify-content:center;
    font-size:18px; z-index:100; text-align:center; padding: 20px; box-sizing:border-box;
  }

  #mapSelect {
    position: fixed; top:0; left:0; width:100%; height:100%;
    background: linear-gradient(180deg, #0a1a2a, #08222e);
    display:none; flex-direction:column; align-items:center; justify-content:center;
    z-index: 90; color:#fff; text-align:center; padding: 24px; box-sizing:border-box;
  }
  #mapSelect h2 { font-size: 20px; margin: 0 0 22px; letter-spacing: 1px; }
  #gameTitle {
    font-size: 34px; font-weight: 900; letter-spacing: 6px; margin: 0 0 4px;
    background: linear-gradient(180deg, #ffe28a, #ff9a3c);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 3px 10px rgba(0,0,0,0.6);
  }
  #gameByline { font-size: 13px; letter-spacing: 2px; color: rgba(255,255,255,0.6); margin: 0 0 22px; }
  #mapSelect .mapBtn {
    width: 260px; max-width: 80vw; padding: 16px 10px; margin-bottom: 16px;
    border-radius: 12px; border: 2px solid rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.08); color:#fff; font-size:16px; font-weight:bold;
  }
  #mapSelect .mapBtn .sub { display:block; font-size:12px; font-weight:normal; opacity:0.75; margin-top:4px; }
  #mapSelect .mapBtn:active { background: rgba(255,255,255,0.22); }
  #pcControlsHint {
    margin-top: 20px; width: 300px; max-width: 84vw; padding: 12px 16px;
    border-radius: 10px; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.06);
    font-size: 12px; line-height: 1.9; text-align: left; color: rgba(255,255,255,0.75);
  }
  #pcControlsHint .title { font-size: 12px; font-weight: bold; color: #ffcf6b; margin-bottom: 6px; letter-spacing: 1px; }
  #pcControlsHint b { color: #fff; font-weight: bold; }
</style>
</head>
<body>

<div id="mapSelect">
  <h2 id="gameTitle">钢铁洪流</h2>
  <div id="gameByline">by 周靖荃</div>
  <button class="mapBtn" data-map="plains">平原<span class="sub">起伏草地 / 沙漠 / 雪山，视野开阔</span></button>
  <button class="mapBtn" data-map="mountains">山地<span class="sub">地形陡峭崎岖，山峰更高更险</span></button>
  <button class="mapBtn" data-map="stalingrad">斯大林格勒<span class="sub">灰色天空下的城市巷战，废墟掩体带门可穿行</span></button>
  <button class="mapBtn" data-map="normandy">诺曼底登陆<span class="sub">灰色滩头强攻，战舰出发抢滩夺取10个据点</span></button>
  <button class="mapBtn" data-map="berlin">柏林保卫战<span class="sub">率20辆坦克强渡泥泞沼泽，攻占山头10个据点</span></button>
  <div id="pcControlsHint">
    <div class="title">电脑按键操作说明</div>
    <div><b>WASD</b> 移动　<b>鼠标</b> 视角</div>
    <div><b>左键</b> 开火　<b>右键</b> 瞄准/开镜</div>
    <div><b>滚轮</b> 切换武器　<b>数字键 1-7</b> 选择武器</div>
    <div><b>空格</b> 跳跃　<b>R</b> 装弹　<b>F</b> 上/下车</div>
    <div><b>G</b> 集结令</div>
  </div>
</div>
<div id="loading">加载中...</div>
<div id="victoryText"></div>
<div id="victoryBlackout"></div>
<canvas id="gameCanvas"></canvas>

<div id="hud">
  <div id="hitFlash"></div>
  <div id="topBar">
    <div id="healthWrap"><div id="healthBar"></div></div>
    <div id="scoreText">歼敌: 0</div>
    <div id="ammoText">步枪 24/24</div>
  </div>
  <div id="casualtyText">我方阵亡: 0</div>
  <div id="holdTimerText">坚守剩余: 10:00</div>
  <div id="crosshair"></div>
  <div id="hitMarker"></div>
  <div id="controlHud"></div>
  <div id="captureStatus">正在争夺据点…</div>
  <div id="respawnMsg">阵亡 · 已在据点重生</div>
  <div id="rallyMsg"></div>
  <div id="reloadHint">弹药耗尽，点右上角换弹</div>
</div>

<div id="joystickZone">
  <div id="joystickBase"><div id="joystickStick"></div></div>
</div>
<div id="lookZone"></div>
<div id="scopeOverlay"></div>
<div id="fireBtn">开火</div>
<div id="jumpBtn">跳</div>
<div id="aimBtn">瞄准</div>
<div id="reloadBtn">换弹</div>
<div id="weaponBtn">步枪</div>
<div id="vehicleBtn">上车</div>
<div id="commandBtn">指挥</div>

<script src="three.min.js"></script>
<script>
window.addEventListener('load', () => {
  const loadingEl = document.getElementById('loading');
  try {
    if (typeof THREE === 'undefined') {
      throw new Error('Three.js 库加载失败，请检查网络连接后刷新页面');
    }
    loadingEl.style.display = 'none';
    init();
    document.getElementById('mapSelect').style.display = 'flex';
  } catch (err) {
    loadingEl.style.color = '#ff6b6b';
    loadingEl.textContent = '加载出错: ' + err.message;
    console.error(err);
  }
});

function init() {
  // =========================================================
  // 基础场景
  // =========================================================
  const canvas = document.getElementById('gameCanvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8fc7ff);
  scene.fog = new THREE.Fog(0x8fc7ff, 26, 95);

  const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
  const playerHeight = 1.88; // 视点高度：人物身高整体抬高
  let playerInWater = false; // 诺曼底地图专用：玩家是否处于深海/浅滩游泳状态

  const yawObject = new THREE.Object3D();
  const pitchObject = new THREE.Object3D();
  pitchObject.add(camera);
  yawObject.add(pitchObject);
  yawObject.position.set(0, playerHeight, 8);
  scene.add(yawObject);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x445566, 0.9);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 0.95);
  sun.position.set(30, 50, 20);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -40;
  sun.shadow.camera.right = 40;
  sun.shadow.camera.top = 40;
  sun.shadow.camera.bottom = -40;
  scene.add(sun);
  scene.add(sun.target);

  // =========================================================
  // 噪声函数（用于地形高度 / 生态群系 / 道具摆放，均为可复现的伪随机）
  // =========================================================
  function hash2(x, z) {
    const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453123;
    return s - Math.floor(s);
  }
  function noise2D(x, z) {
    const xi = Math.floor(x), zi = Math.floor(z);
    const xf = x - xi, zf = z - zi;
    const h00 = hash2(xi, zi), h10 = hash2(xi + 1, zi);
    const h01 = hash2(xi, zi + 1), h11 = hash2(xi + 1, zi + 1);
    const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
    const nx0 = h00 * (1 - u) + h10 * u;
    const nx1 = h01 * (1 - u) + h11 * u;
    return nx0 * (1 - v) + nx1 * v;
  }
  function fbm(x, z, octaves) {
    let total = 0, amp = 0.5, freq = 1, maxVal = 0;
    for (let i = 0; i < octaves; i++) {
      total += noise2D(x * freq, z * freq) * amp;
      maxVal += amp;
      amp *= 0.5; freq *= 2;
    }
    return total / maxVal; // 0..1
  }
  let mapType = 'plains'; // 'plains' | 'mountains' | 'stalingrad' | 'normandy' | 'berlin'
  function isBoundedMap() { return mapType === 'stalingrad' || mapType === 'normandy' || mapType === 'berlin'; } // 有边界、非无限流式加载、共用墙体碰撞系统的地图

  // =========================================================
  // 柏林保卫战地图：棕色沼泽山头（前段，10个据点） -> 灰色柏林城区（后段，斯大林格勒式楼房）
  // 玩家与20辆坦克在南侧集结，向北推进强攻山头上的10个据点，作战逻辑与诺曼底一致
  // =========================================================
  const BERLIN_HALF_W = 62;        // 地图半宽
  const BERLIN_SPAWN_Z = 112;      // 我方集结线（玩家 + 20辆坦克出生）
  const BERLIN_SWAMP_NEAR_Z = 100; // 沼泽山头带的近端（靠我方一侧）
  const BERLIN_SWAMP_FAR_Z = 26;   // 沼泽山头带的远端，再往北就是城区
  const BERLIN_CITY_FAR_Z = -78;   // 城区远端边界

  // 沼泽段是抬升的棕色泥泞高地（据点全在高地的山头上），城区段在低处完全平坦。
  // 从城区往高地做 38 个单位的爬升过渡，形成一道需要仰攻的坡地。
  function berlinGroundHeight(x, z) {
    if (z <= BERLIN_SWAMP_FAR_Z) return 0;
    const t = Math.min(1, (z - BERLIN_SWAMP_FAR_Z) / 38); // 爬坡过渡拉长，坡度控制在约30°，坦克能上得去
    const base = 15;                                   // 高地基准面：整体高出城区约15米
    const hills = fbm(x * 0.021 + 90, z * 0.021 + 90, 4) * 18; // 高地上的山头起伏
    return (base + hills) * t;
  }

  // 是否踩在沼泽上（决定移动减速）。城区与集结线后方不算沼泽。
  function inBerlinSwamp(x, z) {
    return mapType === 'berlin' && z > BERLIN_SWAMP_FAR_Z && z < BERLIN_SWAMP_NEAR_Z + 6;
  }

  function heightNoise01(x, z) {
    const freq = mapType === 'mountains' ? 0.03 : 0.015;
    return fbm(x * freq, z * freq, 5);
  }
  function shapeHeight(h01) {
    if (mapType === 'mountains') return Math.pow(h01, 1.7) * 42 - 8;
    return Math.pow(h01, 1.4) * 14 - 3;
  }
  function getGroundHeight(x, z) {
    if (mapType === 'normandy') return normandyGroundHeight(x, z);
    if (mapType === 'berlin') return berlinGroundHeight(x, z);
    if (isBoundedMap()) return 0;
    return shapeHeight(heightNoise01(x, z));
  }
  function getBiomeValue(x, z) { return fbm(x * 0.004 + 500, z * 0.004 + 500, 3); }

  const COL_SAND = new THREE.Color(0xd8c48a);
  const COL_GRASS = new THREE.Color(0x4c7a3f);
  const COL_GRASS_DARK = new THREE.Color(0x35591f);
  const COL_ROCK = new THREE.Color(0x8a8a86);
  const COL_SNOW = new THREE.Color(0xeef3f7);
  function getGroundColor(h01, biome, out) {
    let c;
    if (biome < 0.32) c = COL_SAND.clone();
    else if (biome < 0.62) c = COL_GRASS.clone().lerp(COL_GRASS_DARK, Math.min(1, h01 * 1.3));
    else if (biome < 0.8) c = COL_ROCK.clone();
    else c = COL_SNOW.clone();
    if (h01 > 0.68) c.lerp(COL_SNOW, Math.min(1, (h01 - 0.68) / 0.3));
    out.copy(c);
  }

  // =========================================================
  // 地形分块（无限地形流式加载）
  // =========================================================
  const chunkSize = 40, segs = 14, viewRadius = 2;
  const loadedChunks = new Map();
  const chunkKey = (cx, cz) => cx + ',' + cz;
  const worldToChunk = (x, z) => [Math.floor(x / chunkSize), Math.floor(z / chunkSize)];

  const treeMatTrunk = new THREE.MeshStandardMaterial({ color: 0x6b4a2b });
  const treeMatLeaf = new THREE.MeshStandardMaterial({ color: 0x2f6b2f });
  const snowTreeMatLeaf = new THREE.MeshStandardMaterial({ color: 0xdff0e6 });
  const rockMat = new THREE.MeshStandardMaterial({ color: 0x8f8f8a, flatShading: true });
  const cactusMat = new THREE.MeshStandardMaterial({ color: 0x3f7d4a });

  function makeTree() {
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, 1.1, 6), treeMatTrunk);
    trunk.position.y = 0.55; trunk.castShadow = true; g.add(trunk);
    const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.75, 1.6, 7), treeMatLeaf);
    leaf.position.y = 1.7; leaf.castShadow = true; g.add(leaf);
    return g;
  }
  function makeSnowTree() {
    const g = makeTree();
    g.children[1].material = snowTreeMatLeaf;
    return g;
  }
  function makeRock() {
    const size = 0.4 + hash2(Math.random() * 999, Math.random() * 999) * 0.5;
    const mesh = new THREE.Mesh(new THREE.DodecahedronGeometry(size, 0), rockMat);
    mesh.position.y = size * 0.5;
    mesh.castShadow = true;
    return mesh;
  }
  function makeCactus() {
    const g = new THREE.Group();
    const main = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.18, 1.3, 7), cactusMat);
    main.position.y = 0.65; main.castShadow = true; g.add(main);
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.5, 6), cactusMat);
    arm.position.set(0.2, 0.9, 0); arm.rotation.z = -0.9; g.add(arm);
    return g;
  }

  const ruinMat = new THREE.MeshStandardMaterial({ color: 0x9a958c, roughness: 1 });
  function makeRuinBuilding() {
    const g = new THREE.Group();
    const w = 1.6 + Math.random() * 1.6, d = 1.6 + Math.random() * 1.6, h = 1.2 + Math.random() * 1.8;
    const wall1 = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.2), ruinMat);
    wall1.position.set(0, h / 2, -d / 2); g.add(wall1);
    const wall2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, h * 0.7, d), ruinMat);
    wall2.position.set(-w / 2, h * 0.35, 0); wall2.rotation.z = (Math.random() - 0.5) * 0.15; g.add(wall2);
    if (Math.random() > 0.4) {
      const wall3 = new THREE.Mesh(new THREE.BoxGeometry(w * 0.6, h * 0.5, 0.18), ruinMat);
      wall3.position.set(w * 0.15, h * 0.25, d * 0.3); wall3.rotation.y = 0.3; g.add(wall3);
    }
    const rubble = new THREE.Mesh(new THREE.DodecahedronGeometry(0.35, 0), ruinMat);
    rubble.position.set(0.3, 0.15, 0.4); g.add(rubble);
    g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    g.userData.footprint = Math.max(w, d) * 0.55;
    return g;
  }

  function maybeSpawnProp(group, wx, wz, biome, obstacleList) {
    const groundY = getGroundHeight(wx, wz);
    const ruinRoll = hash2(wx * 0.27 + 11, wz * 0.27 + 7);
    if (ruinRoll > 0.965) {
      const mesh = makeRuinBuilding();
      mesh.position.set(wx, groundY, wz);
      mesh.rotation.y = hash2(wx, wz) * Math.PI * 2;
      group.add(mesh);
      obstacleList.push({ x: wx, z: wz, radius: mesh.userData.footprint });
      return;
    }
    const r = hash2(wx * 0.13, wz * 0.13);
    if (r <= 0.86) return;
    let mesh;
    if (biome < 0.32) mesh = makeCactus();
    else if (biome < 0.62) mesh = (r > 0.93) ? makeRock() : makeTree();
    else if (biome < 0.8) mesh = makeRock();
    else mesh = makeSnowTree();
    mesh.position.x = wx; mesh.position.z = wz; mesh.position.y += groundY;
    mesh.rotation.y = hash2(wx * 3.1, wz * 5.7) * Math.PI * 2;
    group.add(mesh);
    obstacleList.push({ x: wx, z: wz, radius: 0.65 });
  }

  const groundMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, metalness: 0 });

  function generateChunk(cx, cz) {
    const wx0 = cx * chunkSize, wz0 = cz * chunkSize;
    const geo = new THREE.PlaneGeometry(chunkSize, chunkSize, segs, segs);
    const pos = geo.attributes.position;
    const colors = new Float32Array(pos.count * 3);
    const tmpColor = new THREE.Color();
    for (let i = 0; i < pos.count; i++) {
      const lx = pos.getX(i), ly = pos.getY(i);
      const wx = wx0 + lx, wz = wz0 - ly;
      const h01 = heightNoise01(wx, wz);
      pos.setZ(i, shapeHeight(h01));
      const biome = getBiomeValue(wx, wz);
      getGroundColor(h01, biome, tmpColor);
      colors[i * 3] = tmpColor.r; colors[i * 3 + 1] = tmpColor.g; colors[i * 3 + 2] = tmpColor.b;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, groundMat);
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.set(wx0, 0, wz0);
    mesh.receiveShadow = true;
    scene.add(mesh);

    const propGroup = new THREE.Group();
    scene.add(propGroup);
    const obstacleList = [];
    const step = 6;
    for (let gx = -chunkSize / 2 + step / 2; gx < chunkSize / 2; gx += step) {
      for (let gz = -chunkSize / 2 + step / 2; gz < chunkSize / 2; gz += step) {
        const jx = (hash2(wx0 + gx, wz0 + gz) - 0.5) * step * 0.6;
        const jz = (hash2(wz0 + gz, wx0 + gx) - 0.5) * step * 0.6;
        const wx = wx0 + gx + jx, wz = wz0 + gz + jz;
        maybeSpawnProp(propGroup, wx, wz, getBiomeValue(wx, wz), obstacleList);
      }
    }
    loadedChunks.set(chunkKey(cx, cz), { mesh, propGroup, obstacles: obstacleList });
  }

  function unloadChunk(cx, cz) {
    const key = chunkKey(cx, cz);
    const c = loadedChunks.get(key);
    if (!c) return;
    scene.remove(c.mesh);
    c.mesh.geometry.dispose();
    scene.remove(c.propGroup);
    c.propGroup.traverse(o => { if (o.geometry) o.geometry.dispose(); });
    loadedChunks.delete(key);
  }

  function updateChunks() {
    const [pcx, pcz] = worldToChunk(yawObject.position.x, yawObject.position.z);
    for (let cx = pcx - viewRadius; cx <= pcx + viewRadius; cx++) {
      for (let cz = pcz - viewRadius; cz <= pcz + viewRadius; cz++) {
        if (!loadedChunks.has(chunkKey(cx, cz))) generateChunk(cx, cz);
      }
    }
    for (const key of Array.from(loadedChunks.keys())) {
      const [cx, cz] = key.split(',').map(Number);
      if (Math.abs(cx - pcx) > viewRadius + 1 || Math.abs(cz - pcz) > viewRadius + 1) unloadChunk(cx, cz);
    }
  }

  function collidesAt(x, z, radius) {
    if (isBoundedMap()) {
      for (const b of mazeWallBoxes) {
        const cx = Math.max(b.minX, Math.min(x, b.maxX));
        const cz = Math.max(b.minZ, Math.min(z, b.maxZ));
        const dx = x - cx, dz = z - cz;
        if (dx * dx + dz * dz < radius * radius) return true;
      }
      return false;
    }
    for (const c of loadedChunks.values()) {
      for (const o of c.obstacles) {
        const dx = x - o.x, dz = z - o.z;
        const rr = radius + o.radius;
        if (dx * dx + dz * dz < rr * rr) return true;
      }
    }
    return false;
  }

  // NPC 寻路避障：朝目标方向直线移动被障碍挡住时，尝试向左右偏转角度绕开，而不是直接卡在原地
  const AVOID_ANGLES = [0, 0.35, -0.35, 0.7, -0.7, 1.05, -1.05, 1.4, -1.4];
  function steerTowards(pos, dx, dz, dist, speed, dt, radius) {
    if (dist < 0.01) return false;
    const baseAngle = Math.atan2(dx, dz);
    const r = radius || 0.5;
    for (const off of AVOID_ANGLES) {
      const ang = baseAngle + off;
      const mx = Math.sin(ang), mz = Math.cos(ang);
      const nx = pos.x + mx * speed * dt;
      const nz = pos.z + mz * speed * dt;
      if (!collidesAt(nx, nz, r)) {
        pos.x = nx; pos.z = nz;
        pos.y = getGroundHeight(nx, nz); // 跟随地形起伏，避免在斜坡/丘陵上悬空或陷入地面
        return true;
      }
    }
    return false;
  }

  // =========================================================
  // 有边界地图的墙体骨架系统（网格坐标 + 门洞算法），目前由斯大林格勒地图使用
  // =========================================================
  const mazeCols = 18, mazeRows = 18, mazeCellSize = 7, mazeWallHeight = 3.2, mazeWallThick = 0.5;
  const mazeWallBoxes = [];
  const mazeWallMeshes = [];
  const mazeGroup = new THREE.Group();
  let mazeOrigin = { x: 0, z: 0 };
  const mazeWallMat = new THREE.MeshStandardMaterial({ color: 0x8a8378, roughness: 0.95 });

  function generateMazeGrid(cols, rows) {
    const visited = Array.from({ length: rows }, () => new Array(cols).fill(false));
    const vWall = Array.from({ length: rows }, () => new Array(cols).fill(true)); // 格子右侧是否有墙
    const hWall = Array.from({ length: rows }, () => new Array(cols).fill(true)); // 格子下方是否有墙
    const stack = [[0, 0]];
    visited[0][0] = true;
    while (stack.length) {
      const [r, c] = stack[stack.length - 1];
      const options = [];
      if (r > 0 && !visited[r - 1][c]) options.push([r - 1, c, 'up']);
      if (r < rows - 1 && !visited[r + 1][c]) options.push([r + 1, c, 'down']);
      if (c > 0 && !visited[r][c - 1]) options.push([r, c - 1, 'left']);
      if (c < cols - 1 && !visited[r][c + 1]) options.push([r, c + 1, 'right']);
      if (options.length === 0) { stack.pop(); continue; }
      const [nr, nc, dir] = options[Math.floor(Math.random() * options.length)];
      if (dir === 'up') hWall[r - 1][c] = false;
      else if (dir === 'down') hWall[r][c] = false;
      else if (dir === 'left') vWall[r][c - 1] = false;
      else if (dir === 'right') vWall[r][c] = false;
      visited[nr][nc] = true;
      stack.push([nr, nc]);
    }
    return { vWall, hWall };
  }

  // ---------------------------------------------------------------
  // 性能优化：墙体（迷宫骨架墙 + 斯大林格勒建筑墙）此前每一段都是独立 Mesh，
  // 一张地图轻松累计到几百上千个绘制调用，移动端容易卡顿甚至白屏崩溃。
  // 这里改成按材质分组，先把每段墙的位置/尺寸收集起来，地图生成完毕后
  // 每种材质只合批成 1 个 InstancedMesh 提交给 GPU（碰撞用的 AABB 列表不受影响，逻辑不变）。
  // ---------------------------------------------------------------
  const UNIT_BOX_GEO = new THREE.BoxGeometry(1, 1, 1);
  const wallInstGroups = new Map(); // material -> [{cx,cz,sizeX,sizeZ,height}, ...]
  const _wallInstDummy = new THREE.Object3D();
  function queueMazeWall(cx, cz, sizeX, sizeZ, height, mat) {
    const key = mat || mazeWallMat;
    let list = wallInstGroups.get(key);
    if (!list) { list = []; wallInstGroups.set(key, list); }
    list.push({ cx, cz, sizeX, sizeZ, height });
    mazeWallBoxes.push({ minX: cx - sizeX / 2 - 0.12, maxX: cx + sizeX / 2 + 0.12, minZ: cz - sizeZ / 2 - 0.12, maxZ: cz + sizeZ / 2 + 0.12 });
  }
  function flushWallInstances() {
    wallInstGroups.forEach((list, mat) => {
      if (!list.length) return;
      const inst = new THREE.InstancedMesh(UNIT_BOX_GEO, mat, list.length);
      inst.castShadow = true; inst.receiveShadow = true;
      inst.userData.isMazeWall = true;
      list.forEach((w, idx) => {
        _wallInstDummy.position.set(w.cx, w.height / 2, w.cz);
        _wallInstDummy.rotation.set(0, 0, 0);
        _wallInstDummy.scale.set(w.sizeX, w.height, w.sizeZ);
        _wallInstDummy.updateMatrix();
        inst.setMatrixAt(idx, _wallInstDummy.matrix);
      });
      inst.instanceMatrix.needsUpdate = true;
      mazeGroup.add(inst);
      mazeWallMeshes.push(inst);
    });
    wallInstGroups.clear();
  }

  function addMazeWall(cx, cz, sizeX, sizeZ, mat) {
    queueMazeWall(cx, cz, sizeX, sizeZ, mazeWallHeight, mat);
  }

  // 视线是否被墙体挡住（迷宫/斯大林格勒地图专属，其余地图始终视为通视）
  const losRaycaster = new THREE.Raycaster();
  function hasLineOfSight(fromPos, toPos) {
    if (!isBoundedMap()) return true;
    const dir = new THREE.Vector3().subVectors(toPos, fromPos);
    const dist = dir.length();
    if (dist < 0.05) return true;
    dir.normalize();
    losRaycaster.set(fromPos, dir);
    losRaycaster.far = dist - 0.25;
    const hits = losRaycaster.intersectObjects(mazeWallMeshes, false);
    return hits.length === 0;
  }

  // 注意：地形的初始生成延后到玩家在开局菜单选择地图后触发（见文件末尾 startGame()）

  // =========================================================
  // 斯大林格勒地图（城市巷战：类迷宫掩体骨架 + 随机开放街道 + 门洞掩体，天空整体灰色调）
  // =========================================================
  const stalingradWallMat = new THREE.MeshStandardMaterial({ color: 0x5c5c58, roughness: 1 });
  const stalingradGroundMat = new THREE.MeshStandardMaterial({ color: 0x4a4a46, roughness: 1 });
  const stalingradBuildingMat = new THREE.MeshStandardMaterial({ color: 0x716a5e, roughness: 0.95 });
  const stalingradBuildingMat2 = new THREE.MeshStandardMaterial({ color: 0x676056, roughness: 0.95 });
  const stalingradRoofMat = new THREE.MeshStandardMaterial({ color: 0x3c3833, roughness: 1 });
  const stalingradWindowMat = new THREE.MeshStandardMaterial({ color: 0x14161a, roughness: 0.6 });
  const stalingradFloorLineMat = new THREE.MeshStandardMaterial({ color: 0x53504a, roughness: 1 });

  // 建造一段自定义高度的实体墙（用于建筑物楼体，与街道骨架墙分离，方便做不同层高/坍塌效果）
  // 同样走合批队列，不再每段单独建 Mesh
  function addBuildingWall(cx, cz, sizeX, sizeZ, height, mat) {
    queueMazeWall(cx, cz, sizeX, sizeZ, height, mat);
  }

  // 建造带门洞的建筑墙面（自定义高度版）
  function addBuildingWallWithDoor(cx, cz, sizeX, sizeZ, height, mat) {
    const doorWidth = 2.1;
    if (sizeX >= sizeZ) {
      const segLen = (sizeX - doorWidth) / 2;
      if (segLen > 0.3) {
        addBuildingWall(cx - (doorWidth / 2 + segLen / 2), cz, segLen, sizeZ, height, mat);
        addBuildingWall(cx + (doorWidth / 2 + segLen / 2), cz, segLen, sizeZ, height, mat);
      } else {
        addBuildingWall(cx, cz, sizeX, sizeZ, height, mat);
      }
    } else {
      const segLen = (sizeZ - doorWidth) / 2;
      if (segLen > 0.3) {
        addBuildingWall(cx, cz - (doorWidth / 2 + segLen / 2), sizeX, segLen, height, mat);
        addBuildingWall(cx, cz + (doorWidth / 2 + segLen / 2), sizeX, segLen, height, mat);
      } else {
        addBuildingWall(cx, cz, sizeX, sizeZ, height, mat);
      }
    }
  }

  // 窗户/楼层线/屋顶/碎砖瓦砾全部改用 InstancedMesh 批量渲染（同一栋楼几十个装饰件合并成 1 次 GPU 绘制调用），
  // 避免每栋楼几十个独立 Mesh 叠加导致移动端绘制调用暴增、卡顿甚至白屏崩溃
  const windowGeo = new THREE.BoxGeometry(0.7, 0.95, 0.08);
  const floorLineGeo = new THREE.BoxGeometry(1, 0.08, 1);
  const UNIT_DODECA_GEO = new THREE.DodecahedronGeometry(1, 0);
  let windowInstanceData = [];
  let floorLineInstanceData = [];
  let roofInstanceData = [];       // 完整屋顶（方块）
  let roofDebrisInstanceData = []; // 屋顶碎砖（多面体）
  let groundRubbleInstanceData = []; // 地面散落瓦砾（多面体）
  const _instDummy = new THREE.Object3D();

  // 沿一面墙的外侧贴几排窗户装饰（纯视觉，不参与碰撞），营造楼房层次感；先收集坐标，统一在建图结束后合批
  // hasDoorGap 有值时表示该墙面中央留有一条通高的门洞豁口，跳过落在豁口范围内的窗户位置，避免窗户悬空
  function addWindowRow(cx, cz, axisIsX, length, wallThick, floors, floorH, doorGapWidth) {
    const perFloor = length > 4.5 ? 3 : 2;
    const margin = length * 0.16;
    const usable = length - margin * 2;
    for (let f = 0; f < floors; f++) {
      const wy = f * floorH + floorH * 0.58;
      for (let i = 0; i < perFloor; i++) {
        const t = perFloor === 1 ? 0.5 : i / (perFloor - 1);
        const off = -usable / 2 + usable * t;
        if (doorGapWidth && Math.abs(off) < doorGapWidth / 2 + 0.35) continue;
        windowInstanceData.push({
          x: axisIsX ? cx + off : cx, y: wy, z: axisIsX ? cz : cz + off,
          rotY: axisIsX ? 0 : Math.PI / 2,
          sz: (wallThick + 0.08) / 0.08
        });
      }
    }
  }

  // 在指定格子中心建造一栋多层废墟建筑：四面墙（一面带门），可能有一面墙半坍塌，随机加楼顶与窗户
  function addStalingradBuilding(cx, cz) {
    const sizeX = 4.0 + Math.random() * 1.6;
    const sizeZ = 4.0 + Math.random() * 1.6;
    const wt = 0.4;
    const floors = 2 + Math.floor(Math.random() * 3); // 2~4 层
    const floorH = 2.3;
    const fullHeight = floors * floorH;
    const mat = Math.random() < 0.5 ? stalingradBuildingMat : stalingradBuildingMat2;
    const collapsed = Math.random() < 0.35 ? Math.floor(Math.random() * 4) : -1;

    const sides = [
      { i: 0, cx: cx, cz: cz - sizeZ / 2, sx: sizeX, sz: wt, axisIsX: true, len: sizeX },
      { i: 1, cx: cx, cz: cz + sizeZ / 2, sx: sizeX, sz: wt, axisIsX: true, len: sizeX },
      { i: 2, cx: cx - sizeX / 2, cz: cz, sx: wt, sz: sizeZ, axisIsX: false, len: sizeZ },
      { i: 3, cx: cx + sizeX / 2, cz: cz, sx: wt, sz: sizeZ, axisIsX: false, len: sizeZ },
    ];

    sides.forEach(s => {
      const h = s.i === collapsed ? fullHeight * (0.25 + Math.random() * 0.3) : fullHeight;
      // 四面墙都开门洞，任意方向都能直接穿行进出建筑，不再只有一面墙可通过
      addBuildingWallWithDoor(s.cx, s.cz, s.sx, s.sz, h, mat);
      // 坍塌的墙面不加窗户，其余墙面按楼层贴窗（用实际高度换算出还剩几层可见），并统一避开中央门洞豁口
      if (s.i !== collapsed) addWindowRow(s.cx, s.cz, s.axisIsX, s.len, wt, Math.max(1, Math.round(h / floorH)), floorH, 2.1);
    });

    // 楼层分隔线（细长装饰条，纯视觉，套在四面墙外沿，强化"多层楼房"观感）；同样收集到实例数组统一合批
    for (let f = 1; f < floors; f++) {
      const fy = f * floorH;
      if (fy >= fullHeight - 0.1) continue;
      floorLineInstanceData.push({ x: cx, y: fy, z: cz, sx: sizeX + 0.15, sz: sizeZ + 0.15 });
    }

    // 屋顶：约65%概率保留完整屋顶，其余作为无顶残楼，天光可直接照进内部
    if (Math.random() < 0.65) {
      roofInstanceData.push({ x: cx, y: fullHeight + 0.15, z: cz, sx: sizeX + 0.3, sz: sizeZ + 0.3 });
    } else {
      // 无顶时在楼顶边缘散落一两块碎砖，暗示坍塌痕迹（数量压低以控制场景总面片数）
      const chunkCount = 1 + (Math.random() < 0.4 ? 1 : 0);
      for (let i = 0; i < chunkCount; i++) {
        roofDebrisInstanceData.push({
          x: cx + (Math.random() - 0.5) * sizeX * 0.7,
          y: fullHeight * (0.3 + Math.random() * 0.5),
          z: cz + (Math.random() - 0.5) * sizeZ * 0.7,
          scale: 0.25 + Math.random() * 0.25,
          rx: Math.random() * Math.PI, ry: Math.random() * Math.PI, rz: Math.random() * Math.PI
        });
      }
    }
  }

  // 把收集到的窗户/楼层线坐标合批成 InstancedMesh，一次性提交给 GPU（几千个装饰面片只占 1~2 次绘制调用）
  function flushBuildingInstances() {
    if (windowInstanceData.length) {
      const inst = new THREE.InstancedMesh(windowGeo, stalingradWindowMat, windowInstanceData.length);
      windowInstanceData.forEach((w, idx) => {
        _instDummy.position.set(w.x, w.y, w.z);
        _instDummy.rotation.set(0, w.rotY, 0);
        _instDummy.scale.set(1, 1, w.sz);
        _instDummy.updateMatrix();
        inst.setMatrixAt(idx, _instDummy.matrix);
      });
      inst.instanceMatrix.needsUpdate = true;
      mazeGroup.add(inst);
      windowInstanceData = [];
    }
    if (floorLineInstanceData.length) {
      const inst = new THREE.InstancedMesh(floorLineGeo, stalingradFloorLineMat, floorLineInstanceData.length);
      floorLineInstanceData.forEach((l, idx) => {
        _instDummy.position.set(l.x, l.y, l.z);
        _instDummy.rotation.set(0, 0, 0);
        _instDummy.scale.set(l.sx, 1, l.sz);
        _instDummy.updateMatrix();
        inst.setMatrixAt(idx, _instDummy.matrix);
      });
      inst.instanceMatrix.needsUpdate = true;
      mazeGroup.add(inst);
      floorLineInstanceData = [];
    }
    if (roofInstanceData.length) {
      const inst = new THREE.InstancedMesh(UNIT_BOX_GEO, stalingradRoofMat, roofInstanceData.length);
      inst.castShadow = true; inst.receiveShadow = true;
      roofInstanceData.forEach((rf, idx) => {
        _instDummy.position.set(rf.x, rf.y, rf.z);
        _instDummy.rotation.set(0, 0, 0);
        _instDummy.scale.set(rf.sx, 0.3, rf.sz);
        _instDummy.updateMatrix();
        inst.setMatrixAt(idx, _instDummy.matrix);
      });
      inst.instanceMatrix.needsUpdate = true;
      mazeGroup.add(inst);
      roofInstanceData = [];
    }
    if (roofDebrisInstanceData.length) {
      const inst = new THREE.InstancedMesh(UNIT_DODECA_GEO, stalingradRoofMat, roofDebrisInstanceData.length);
      roofDebrisInstanceData.forEach((d, idx) => {
        _instDummy.position.set(d.x, d.y, d.z);
        _instDummy.rotation.set(d.rx, d.ry, d.rz);
        _instDummy.scale.set(d.scale, d.scale, d.scale);
        _instDummy.updateMatrix();
        inst.setMatrixAt(idx, _instDummy.matrix);
      });
      inst.instanceMatrix.needsUpdate = true;
      mazeGroup.add(inst);
      roofDebrisInstanceData = [];
    }
    if (groundRubbleInstanceData.length) {
      const inst = new THREE.InstancedMesh(UNIT_DODECA_GEO, stalingradWallMat, groundRubbleInstanceData.length);
      inst.castShadow = true;
      groundRubbleInstanceData.forEach((d, idx) => {
        _instDummy.position.set(d.x, d.y, d.z);
        _instDummy.rotation.set(d.rx, d.ry, d.rz);
        _instDummy.scale.set(d.scale, d.scale, d.scale);
        _instDummy.updateMatrix();
        inst.setMatrixAt(idx, _instDummy.matrix);
      });
      inst.instanceMatrix.needsUpdate = true;
      mazeGroup.add(inst);
      groundRubbleInstanceData = [];
    }
  }

  // 建造一段带门洞的墙体：从中间断开留出可通行缺口，模拟建筑物的门/破口
  function addWallWithDoor(cx, cz, sizeX, sizeZ, mat) {
    const doorWidth = 2.0;
    if (sizeX >= sizeZ) {
      const segLen = (sizeX - doorWidth) / 2;
      if (segLen > 0.3) {
        addMazeWall(cx - (doorWidth / 2 + segLen / 2), cz, segLen, sizeZ, mat);
        addMazeWall(cx + (doorWidth / 2 + segLen / 2), cz, segLen, sizeZ, mat);
      } else {
        addMazeWall(cx, cz, sizeX, sizeZ, mat);
      }
    } else {
      const segLen = (sizeZ - doorWidth) / 2;
      if (segLen > 0.3) {
        addMazeWall(cx, cz - (doorWidth / 2 + segLen / 2), sizeX, segLen, mat);
        addMazeWall(cx, cz + (doorWidth / 2 + segLen / 2), sizeX, segLen, mat);
      } else {
        addMazeWall(cx, cz, sizeX, sizeZ, mat);
      }
    }
  }

  function generateStalingrad() {
    scene.add(mazeGroup);
    const { vWall, hWall } = generateMazeGrid(mazeCols, mazeRows); // 复用迷宫骨架算法生成建筑物基础布局
    const originX = -(mazeCols * mazeCellSize) / 2, originZ = -(mazeRows * mazeCellSize) / 2;
    mazeOrigin = { x: originX, z: originZ };

    const groundGeo = new THREE.PlaneGeometry(mazeCols * mazeCellSize + 24, mazeRows * mazeCellSize + 24);
    const groundMesh = new THREE.Mesh(groundGeo, stalingradGroundMat);
    groundMesh.rotation.x = -Math.PI / 2;
    groundMesh.receiveShadow = true;
    mazeGroup.add(groundMesh);

    for (let r = 0; r < mazeRows; r++) {
      for (let c = 0; c < mazeCols; c++) {
        // 只保留约28%的骨架墙体，并在其中开门洞；其余位置直接不建墙，形成开放街道，
        // 整体呈现"类似迷宫但可多路径穿行、建筑带门"的巷战地形，而不是单一通路的封闭迷宫
        if (c < mazeCols - 1 && vWall[r][c] && Math.random() < 0.28) {
          addWallWithDoor(originX + (c + 1) * mazeCellSize, originZ + r * mazeCellSize + mazeCellSize / 2, mazeWallThick, mazeCellSize + mazeWallThick, stalingradWallMat);
        }
        if (r < mazeRows - 1 && hWall[r][c] && Math.random() < 0.28) {
          addWallWithDoor(originX + c * mazeCellSize + mazeCellSize / 2, originZ + (r + 1) * mazeCellSize, mazeCellSize + mazeWallThick, mazeWallThick, stalingradWallMat);
        }
      }
    }
    // 四周边界墙（不开门，防止走出地图边界）
    addMazeWall(originX, originZ + (mazeRows * mazeCellSize) / 2, mazeWallThick, mazeRows * mazeCellSize + mazeWallThick, stalingradWallMat);
    addMazeWall(originX + mazeCols * mazeCellSize, originZ + (mazeRows * mazeCellSize) / 2, mazeWallThick, mazeRows * mazeCellSize + mazeWallThick, stalingradWallMat);
    addMazeWall(originX + (mazeCols * mazeCellSize) / 2, originZ, mazeCols * mazeCellSize + mazeWallThick, mazeWallThick, stalingradWallMat);
    addMazeWall(originX + (mazeCols * mazeCellSize) / 2, originZ + mazeRows * mazeCellSize, mazeCols * mazeCellSize + mazeWallThick, mazeWallThick, stalingradWallMat);

    // 实体多层建筑：在部分内部街区格子里造出真正带体积的楼房（四面墙+门洞+窗户+屋顶/坍塌顶），
    // 而不只是骨架墙皮，让巷战地图有真实的建筑轮廓和可进入的室内空间。
    // 密度控制在约 13%：四面开门后单栋建筑的墙段数量比此前(仅一面开门)翻倍，
    // 因此密度需要进一步下调，才能在"建筑四面可通行"的同时实现"减少墙体总数"。
    // 窗户与楼层线仍是合批的 InstancedMesh，墙体本身是独立碰撞体，密度直接决定总面片/碰撞体量。
    for (let r = 1; r < mazeRows - 1; r++) {
      for (let c = 1; c < mazeCols - 1; c++) {
        if (Math.random() < 0.13) {
          const ccx = originX + c * mazeCellSize + mazeCellSize / 2;
          const ccz = originZ + r * mazeCellSize + mazeCellSize / 2;
          addStalingradBuilding(ccx, ccz);
        }
      }
    }

    // 散落的瓦砾堆，点缀废墟氛围（同样收集到实例数组，与屋顶/碎砖合批渲染）
    for (let i = 0; i < 24; i++) {
      groundRubbleInstanceData.push({
        x: originX + Math.random() * mazeCols * mazeCellSize,
        y: 0.2,
        z: originZ + Math.random() * mazeRows * mazeCellSize,
        scale: 0.3 + Math.random() * 0.4,
        rx: Math.random() * Math.PI, ry: Math.random() * Math.PI, rz: Math.random() * Math.PI
      });
    }
    flushBuildingInstances(); // 窗户/楼层线/屋顶/碎砖/瓦砾一次性合批
    flushWallInstances();     // 街道骨架墙 + 建筑墙体一次性合批
  }

  // 柏林地图的棕色沼泽材质（城区仍沿用斯大林格勒的灰色материалы，保持全图灰调）
  const berlinSwampMat = new THREE.MeshStandardMaterial({ color: 0x5a4632, roughness: 1 });
  const berlinMudMat = new THREE.MeshStandardMaterial({ color: 0x6b5238, roughness: 1 });

  function buildBerlinSwampMesh() {
    const width = (BERLIN_HALF_W + 12) * 2;
    const depth = (BERLIN_SPAWN_Z + 16) - BERLIN_SWAMP_FAR_Z;
    const geo = new THREE.PlaneGeometry(width, depth, 48, 44);
    geo.rotateX(-Math.PI / 2);
    const zOffset = BERLIN_SWAMP_FAR_Z + depth / 2;
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const wx = pos.getX(i);
      const wz = pos.getZ(i) + zOffset;
      pos.setY(i, berlinGroundHeight(wx, wz));
    }
    geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, berlinSwampMat);
    mesh.position.z = zOffset;
    mesh.receiveShadow = true;
    return mesh;
  }

  function generateBerlin() {
    scene.add(mazeGroup);

    // ---- 前段：棕色沼泽山头 ----
    mazeGroup.add(buildBerlinSwampMesh());
    // 零星泥沼水洼，强化沼泽观感
    for (let i = 0; i < 26; i++) {
      const px = (Math.random() - 0.5) * BERLIN_HALF_W * 1.9;
      const pz = BERLIN_SWAMP_FAR_Z + 8 + Math.random() * (BERLIN_SWAMP_NEAR_Z - BERLIN_SWAMP_FAR_Z - 10);
      const puddle = new THREE.Mesh(new THREE.CircleGeometry(2.5 + Math.random() * 4, 10), berlinMudMat);
      puddle.rotation.x = -Math.PI / 2;
      puddle.position.set(px, berlinGroundHeight(px, pz) + 0.06, pz);
      mazeGroup.add(puddle);
    }

    // ---- 后段：柏林城区，复用斯大林格勒的楼房生成 ----
    const cityDepth = BERLIN_SWAMP_FAR_Z - BERLIN_CITY_FAR_Z;
    const cityCenterZ = BERLIN_CITY_FAR_Z + cityDepth / 2;
    const groundGeo = new THREE.PlaneGeometry(BERLIN_HALF_W * 2 + 24, cityDepth + 20);
    const groundMesh = new THREE.Mesh(groundGeo, stalingradGroundMat);
    groundMesh.rotation.x = -Math.PI / 2;
    groundMesh.position.z = cityCenterZ;
    groundMesh.receiveShadow = true;
    mazeGroup.add(groundMesh);

    // 按街区网格铺开楼房，模拟柏林城区轮廓
    const blockSize = mazeCellSize;
    const cols = Math.floor((BERLIN_HALF_W * 2) / blockSize);
    const rows = Math.floor(cityDepth / blockSize);
    const originX = -(cols * blockSize) / 2;
    const originZ = BERLIN_CITY_FAR_Z;
    mazeOrigin = { x: originX, z: originZ };
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (Math.random() < 0.30) {
          addStalingradBuilding(originX + c * blockSize + blockSize / 2,
                                originZ + r * blockSize + blockSize / 2);
        }
      }
    }
    // 城区外围边界墙，防止走出地图
    addMazeWall(-BERLIN_HALF_W - 8, cityCenterZ, mazeWallThick, cityDepth + 20, stalingradWallMat);
    addMazeWall(BERLIN_HALF_W + 8, cityCenterZ, mazeWallThick, cityDepth + 20, stalingradWallMat);
    addMazeWall(0, BERLIN_CITY_FAR_Z - 10, BERLIN_HALF_W * 2 + 20, mazeWallThick, stalingradWallMat);

    for (let i = 0; i < 22; i++) {
      groundRubbleInstanceData.push({
        x: (Math.random() - 0.5) * BERLIN_HALF_W * 1.9,
        y: 0.2,
        z: BERLIN_CITY_FAR_Z + Math.random() * cityDepth,
        scale: 0.3 + Math.random() * 0.45,
        rx: Math.random() * Math.PI, ry: Math.random() * Math.PI, rz: Math.random() * Math.PI
      });
    }
    flushBuildingInstances();
    flushWallInstances();
  }

  // =========================================================
  // 诺曼底登陆地图：战舰出发 -> 涉水/游泳抢滩 -> 争夺内陆10个据点
  // 沿用斯大林格勒同款灰色基调，坐标体系是一条"深海 -> 浅滩 -> 沙滩 -> 内陆"的带状区域
  // 出于性能与实现成本考虑，整张地图统一使用 y=0 的可行走平面（船甲板/水面/沙滩/内陆视觉上分层，
  // 玩法层面高度一致），下海时通过降低视角高度+减速来模拟"涉水/游泳"，不做完整的浮力物理
  // =========================================================
  const NORMANDY_HALF_W = 55;       // 地图半宽（x: -55..55）
  const NORMANDY_SHIP_Z = -92;      // 战舰甲板 / 玩家与友军出生点
  const NORMANDY_BOAT_SPAWN_Z = -76;// 快艇初始停泊点（紧挨战舰船艏，在战舰甲板范围之外，避免叠在船体高度上）
  const NORMANDY_SEA_FAR_Z = -110;  // 海域视觉范围远端
  const NORMANDY_BOAT_DOCK_Z = -34; // 快艇靠岸后的最远推进点（不能再往内陆开）
  const NORMANDY_BEACH_Z = -30;     // 深海/浅滩与沙滩的分界（玩家游泳状态的判定线）
  const NORMANDY_LAND_Z = -12;      // 沙滩与内陆的分界
  const NORMANDY_FAR_Z = 85;        // 内陆据点散布的远端边界

  const NORMANDY_DECK_H = 1.7; // 甲板高出海平面的高度（干舷），玩家在战舰范围内的地面高度就是这个值

  // 内陆地形起伏：海/滩保持完全平坦（游泳与快艇物理更简单可靠），从沙滩往内陆 15 个单位内
  // 由 0 渐变到完整起伏幅度，避免和平坦滩头之间出现生硬台阶；战舰甲板范围内则单独抬高到甲板高度
  function normandyGroundHeight(x, z) {
    if (z < NORMANDY_LAND_Z) {
      if (Math.abs(x) < 5.3 && z > NORMANDY_SHIP_Z - 11.5 && z < NORMANDY_SHIP_Z + 11.5) return NORMANDY_DECK_H;
      return 0;
    }
    const h01 = fbm(x * 0.028, z * 0.028, 4);
    const t = Math.min(1, (z - NORMANDY_LAND_Z) / 15);
    return h01 * 10 * t - 1 * t;
  }

  function buildNormandyLandMesh(landMat) {
    const width = (NORMANDY_HALF_W + 10) * 2;
    const depth = (NORMANDY_FAR_Z - NORMANDY_LAND_Z) + 20;
    const segX = 44, segZ = 40;
    const geo = new THREE.PlaneGeometry(width, depth, segX, segZ);
    geo.rotateX(-Math.PI / 2);
    const zOffset = NORMANDY_LAND_Z + depth / 2;
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const wx = pos.getX(i);
      const wz = pos.getZ(i) + zOffset;
      pos.setY(i, normandyGroundHeight(wx, wz));
    }
    geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, landMat);
    mesh.position.set(0, 0, zOffset);
    mesh.receiveShadow = true;
    return mesh;
  }

  function generateNormandy() {
    mazeOrigin = { x: 0, z: 0 }; // 复用全局出生点引用变量，实际坐标系是自定义的条带地图，不是网格迷宫
    scene.add(mazeGroup);
    const seaMat = new THREE.MeshStandardMaterial({ color: 0x585f60, roughness: 0.55, metalness: 0.05 });
    const beachMat = new THREE.MeshStandardMaterial({ color: 0x9a917c, roughness: 1 });
    const landMat = new THREE.MeshStandardMaterial({ color: 0x6f6f61, roughness: 1 });
    const shipMat = new THREE.MeshStandardMaterial({ color: 0x4a4d4a, roughness: 0.8 });
    const shipDarkMat = new THREE.MeshStandardMaterial({ color: 0x2c2e2c, roughness: 0.85 });

    const seaLen = NORMANDY_BEACH_Z - NORMANDY_SEA_FAR_Z;
    const sea = new THREE.Mesh(new THREE.BoxGeometry(NORMANDY_HALF_W * 2 + 20, 0.3, seaLen), seaMat);
    sea.position.set(0, -0.15, NORMANDY_SEA_FAR_Z + seaLen / 2);
    sea.receiveShadow = true;
    mazeGroup.add(sea);

    const beachLen = NORMANDY_LAND_Z - NORMANDY_BEACH_Z;
    const beach = new THREE.Mesh(new THREE.BoxGeometry(NORMANDY_HALF_W * 2 + 20, 0.3, beachLen), beachMat);
    beach.position.set(0, -0.1, NORMANDY_BEACH_Z + beachLen / 2);
    beach.receiveShadow = true;
    mazeGroup.add(beach);

    // 内陆改用带起伏的地形网格，而不是一块平板，靠近沙滩处自然过渡为平地
    mazeGroup.add(buildNormandyLandMesh(landMat));

    // 战舰：简化外形（船体+舰桥+两座炮塔）。船体下半截吃水在海面以下，
    // 甲板顶面抬高到 NORMANDY_DECK_H（明显高于海面，有真实的干舷），
    // normandyGroundHeight() 里战舰范围内会返回同样的高度，玩家与友军就实实在在地"站"在甲板上
    const ship = new THREE.Group();
    const hullTop = NORMANDY_DECK_H - 0.3, hullBottom = -1.8;
    const hull = new THREE.Mesh(new THREE.BoxGeometry(11, hullTop - hullBottom, 22), shipMat);
    hull.position.set(0, (hullTop + hullBottom) / 2, NORMANDY_SHIP_Z);
    hull.castShadow = true; hull.receiveShadow = true;
    ship.add(hull);
    const deck = new THREE.Mesh(new THREE.BoxGeometry(10.4, 0.3, 21), shipDarkMat);
    deck.position.set(0, NORMANDY_DECK_H - 0.15, NORMANDY_SHIP_Z);
    deck.receiveShadow = true;
    ship.add(deck);
    const bridge = new THREE.Mesh(new THREE.BoxGeometry(5, 3.4, 5), shipMat);
    bridge.position.set(0, NORMANDY_DECK_H + 1.7, NORMANDY_SHIP_Z - 5);
    bridge.castShadow = true;
    ship.add(bridge);
    [[-3.2, NORMANDY_SHIP_Z + 6], [3.2, NORMANDY_SHIP_Z + 6]].forEach(p => {
      const turret = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.2, 1.1, 8), shipDarkMat);
      turret.position.set(p[0], NORMANDY_DECK_H + 0.55, p[1]);
      turret.castShadow = true;
      ship.add(turret);
      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 3.2, 8), shipDarkMat);
      barrel.rotation.x = Math.PI / 2;
      barrel.position.set(p[0], NORMANDY_DECK_H + 0.55, p[1] - 2.4);
      ship.add(barrel);
    });
    mazeGroup.add(ship);

    // 沙滩上散布一些低矮掩体（沙包/防登陆桩），沿用墙体合批渲染系统，数量不多不影响性能
    const bunkerMat = new THREE.MeshStandardMaterial({ color: 0x726b58, roughness: 1 });
    for (let i = 0; i < 16; i++) {
      const bx = (Math.random() - 0.5) * NORMANDY_HALF_W * 1.7;
      const bz = NORMANDY_BEACH_Z + 4 + Math.random() * (NORMANDY_LAND_Z - NORMANDY_BEACH_Z - 6);
      queueMazeWall(bx, bz, 1.6 + Math.random() * 0.8, 1.2 + Math.random() * 0.8, 1.1 + Math.random() * 0.5, bunkerMat);
    }
    flushWallInstances();
  }

  function buildGunMesh(weapon) {

  let recoilPitch = 0, recoilYaw = 0, shakeMag = 0;
  function applyRecoil(weapon) {
    recoilPitch += weapon.recoil;
    recoilYaw += (Math.random() - 0.5) * weapon.recoil * 0.6;
    shakeMag = Math.min(shakeMag + weapon.shake, weapon.shake * 2.4);
    muzzleLight.intensity = 3.2;
  }
  function updateRecoil(dt) {
    recoilPitch = Math.max(0, recoilPitch - dt * (recoilPitch * 8 + 0.6));
    recoilYaw *= Math.exp(-dt * 10);
    shakeMag *= Math.exp(-dt * 9);
    muzzleLight.intensity = Math.max(0, muzzleLight.intensity - dt * 14);

    camera.rotation.x = recoilPitch;
    camera.rotation.z = recoilYaw * 0.4;

    const base = isDriving ? vehicleCamOffset : camBaseFP;
    camera.position.set(
      base.x + (Math.random() - 0.5) * shakeMag * 0.07,
      base.y + (Math.random() - 0.5) * shakeMag * 0.07,
      base.z
    );

    gunGroup.position.z = gunBaseZ + recoilPitch * 0.6;
    const targetGunX = (aiming && !isDriving) ? 0.03 : 0.28;
    gunGroup.position.x += (targetGunX - gunGroup.position.x) * Math.min(1, dt * 10);

    targetFov = aiming && !isDriving ? weaponZoomFov[currentWeaponIndex] : baseFov;
    camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 8);
    camera.updateProjectionMatrix();

    if (aiming && weapons[currentWeaponIndex].name === '狙击枪' && !isDriving) {
      scopeOverlay.classList.add('show');
    } else {
      scopeOverlay.classList.remove('show');
    }
  }

  // 所有 NPC 共用同一份枪口火光精灵材质（见下方 createCharacterMesh），不参与场景光照计算，
  // 靠缩放模拟亮灭，避免每个 NPC 都挂一盏真实点光源拖垮移动端渲染性能
  const muzzleFlashSpriteMat = new THREE.SpriteMaterial({ color: 0xffaa55, transparent: true, opacity: 0.9, depthWrite: false, blending: THREE.AdditiveBlending });

  function createCharacterMesh(fixedColor, weaponType) {
    const group = new THREE.Group();
    const profile = npcWeaponProfiles[weaponType] || npcWeaponProfiles.rifle;
    const uniformColor = fixedColor ? new THREE.Color(fixedColor) : new THREE.Color().setHSL(Math.random(), 0.45, 0.4);
    const bodyMat = new THREE.MeshStandardMaterial({ color: uniformColor });
    const headMat = new THREE.MeshStandardMaterial({ color: 0xffd7a8 });
    const limbMat = new THREE.MeshStandardMaterial({ color: uniformColor.clone().multiplyScalar(0.8) });
    const gunMat = new THREE.MeshStandardMaterial({ color: profile.gunColor });

    const torso = new THREE.Mesh(charGeoTorso, bodyMat);
    torso.position.y = 1.15; torso.castShadow = true; group.add(torso);

    const head = new THREE.Mesh(charGeoHead, headMat);
    head.position.y = 1.85; head.castShadow = true; group.add(head);

    // 双手持枪姿势：右手握握把、左手前伸托住护木，枪身端在胸前中线偏右。
    // 原来的姿势是枪挂在身体右侧(x=0.55)、两条手臂自然下垂，看起来像单手拎着枪。
    const armL = new THREE.Mesh(charGeoArm, limbMat);
    armL.position.set(-0.02, 1.30, -0.30);
    armL.rotation.set(-1.35, 0, -0.55); // 横过胸前去托前护木
    armL.castShadow = true; group.add(armL);
    const armR = new THREE.Mesh(charGeoArm, limbMat);

    armR.castShadow = true; group.add(armR);

    const legL = new THREE.Mesh(charGeoLeg, limbMat);
    legL.position.set(-0.16, 0.38, 0); legL.castShadow = true; group.add(legL);
    const legR = new THREE.Mesh(charGeoLeg, limbMat);
    legR.position.set(0.16, 0.38, 0); legR.castShadow = true; group.add(legR);

    const gun = new THREE.Group();
    const gunBody = new THREE.Mesh(charGeoGunBody, gunMat);
    gunBody.position.z = -0.1; gun.add(gunBody);
    const gunBarrel = new THREE.Mesh(getGunBarrelGeo(profile.gunLen), gunMat);
    gunBarrel.rotation.x = Math.PI / 2; gunBarrel.position.set(0, 0.01, -0.14 - profile.gunLen / 2); gun.add(gunBarrel);
    // 性能优化：枪口火光原本是给每个 NPC 挂一盏真实的 THREE.PointLight——40人同屏就是40盏动态光源，
    // 对移动端 GPU 的逐像素光照开销非常致命。这里改成一个共享材质的自发光 Sprite（靠缩放模拟亮灭），
    // 不参与场景光照计算，视觉上仍有闪光效果，但完全不产生额外的光源开销。外部代码仍然通过
    // .intensity 这个自定义属性来触发/衰减它，调用方式不用改。
    const muzzleFlash = new THREE.Sprite(muzzleFlashSpriteMat);
    muzzleFlash.position.set(0, 0.01, -0.14 - profile.gunLen);
    muzzleFlash.scale.setScalar(0.0001);
    muzzleFlash.intensity = 0;
    gun.add(muzzleFlash);
    // 枪端到胸前中线偏右，与双手位置对齐（原本挂在 x=0.55 的身体外侧）
    gun.position.set(0.16, 1.34, -0.30); gun.rotation.set(0, 0, 0);
    group.add(gun);

    group.userData.headMesh = head;
    group.userData.bodyMesh = torso;
    group.userData.armL = armL;
    group.userData.armR = armR;
    group.userData.materials = [bodyMat, headMat, limbMat];

    group.userData.legR = legR;

    return group;

    const angle = Math.random() * Math.PI * 2;
    const radius = SPAWN_RADIUS_MIN + Math.random() * (SPAWN_RADIUS_MAX - SPAWN_RADIUS_MIN);

    const autoRally = (mapType === 'normandy' || mapType === 'berlin') && normandyFinalAssaultTriggered;
    friendlies.push({
      mesh, hp: 120, maxHp: 120, alive: true, speed: 2.1 + Math.random() * 0.8,
      fireCooldown: 1 + Math.random() * 1.5, phase: Math.random() * 10, gunKick: 0,
      followAngle: Math.random() * Math.PI * 2, vehicle: null, inVehicle: false, weaponType, runOverCooldown: 0, burstLeft: 0,
      rallying: !!rallying || autoRally
    });
    return friendlies[friendlies.length - 1];
  }
  function spawnFriendly(forceCp, rallying) {
    let cp = forceCp;
    if (!cp) {
      const ownedAll = getOwnedControlPoints('blue');
      // 诺曼底开局没有任何蓝方据点：援兵直接从战舰甲板出发（登陆后有据点了，才改从前线据点刷新）
      // 用和其它据点一样的"周边拥挤度"节流，避免战舰甲板无限堆人、刷新过于频繁
      if (mapType === 'normandy' && ownedAll.length === 0) {
        const shipPoint = { x: 0, z: NORMANDY_SHIP_Z };
        if (countNearbyAt(shipPoint, friendlies) >= 6) return;
        spawnFriendlyAt((Math.random() - 0.5) * 7, NORMANDY_SHIP_Z + (Math.random() - 0.5) * 8, rallying);
        return;
      }
      // 柏林开局同样是 0 个蓝方据点，若不做特例，owned 恒为空 -> 直接 return，
      // 结果就是攻下第一个据点之前一个友军都不刷新。这里让援军从南侧集结线出发。
      if (mapType === 'berlin' && ownedAll.length === 0) {
        const rallyLine = { x: 0, z: BERLIN_SPAWN_Z };
        if (countNearbyAt(rallyLine, friendlies) >= 8) return;
        spawnFriendlyAt((Math.random() - 0.5) * 34, BERLIN_SPAWN_Z + (Math.random() - 0.5) * 10, rallying);
        return;
      }
      const crowdBase = ownedAll.length <= 1 ? 10 : (ownedAll.length === 2 ? 8 : 5);
      const crowdLimit = mapType === 'stalingrad' ? crowdBase * 2 : crowdBase;
      const owned = ownedAll.filter(c => countNearbyAt(c, friendlies) < crowdLimit);
      if (owned.length === 0) return;
      cp = owned[Math.floor(Math.random() * owned.length)];
    }
    const { x, z } = randomPointNearControlPoint(cp);
    spawnFriendlyAt(x, z, rallying);
  }
  // 注：初始 3 名友军的生成延后到 startGame() 中，等玩家选好地图后再执行

  // 清理离玩家过远的敌我 NPC，防止生成上限被远处旧单位占满导致附近不再刷新
  function cullDistantCombatants(maxDist) {
    for (let i = enemies.length - 1; i >= 0; i--) {
      const en = enemies[i];
      const d = Math.hypot(en.mesh.position.x - yawObject.position.x, en.mesh.position.z - yawObject.position.z);
      if (d > maxDist && !isNearAnyControlPoint(en.mesh.position)) {
        if (en.inVehicle && en.vehicle) en.vehicle.occupant = null;
        scene.remove(en.mesh);
        enemies.splice(i, 1);
      }
    }
    for (let i = friendlies.length - 1; i >= 0; i--) {
      const f = friendlies[i];
      const d = Math.hypot(f.mesh.position.x - yawObject.position.x, f.mesh.position.z - yawObject.position.z);
      if (d > maxDist && !isNearAnyControlPoint(f.mesh.position)) {
        if (f.inVehicle && f.vehicle) f.vehicle.occupant = null;
        scene.remove(f.mesh);
        friendlies.splice(i, 1);
      }
    }
  }
  // 只要单位还在为某个据点作战/驻守，即便远离玩家也不应被清理（否则红方远处刷新会被立刻删掉，永远打不起来）
  function isNearAnyControlPoint(pos) {
    for (const cp of controlPoints) {
      if (Math.hypot(cp.x - pos.x, cp.z - pos.z) < CAPTURE_RADIUS * 2.5) return true;
    }
    return false;
  }

  function updateCharacterVisuals(entity, moving, dt) {
    const m = entity.mesh;
    const gy = getGroundHeight(m.position.x, m.position.z);
    m.position.y = gy + (moving ? Math.abs(Math.sin((elapsed + entity.phase) * 7)) * 0.06 : 0);
    const legSwing = moving ? Math.sin((elapsed + entity.phase) * 8) * 0.5 : 0;
    m.userData.legL.rotation.x = legSwing;
    m.userData.legR.rotation.x = -legSwing;
    m.userData.bodyMesh.position.y = 1.15 + Math.sin((elapsed + entity.phase) * 2.2) * 0.02;
    entity.gunKick *= Math.exp(-dt * 9);
    m.userData.gunMesh.rotation.x = -0.1 - entity.gunKick * 0.6;
    const mf = m.userData.muzzleLight;
    mf.intensity = Math.max(0, mf.intensity - dt * 12);
    mf.scale.setScalar(mf.intensity > 0.02 ? 0.3 + mf.intensity * 0.15 : 0.0001);
  }

  function knockbackEnemy(enemy, dir) {

  // =========================================================
  // 触屏摇杆（移动）
  // =========================================================
  const joystickZone = document.getElementById('joystickZone');
  const joystickBase = document.getElementById('joystickBase');
  const joystickStick = document.getElementById('joystickStick');
  let joystickActive = false, joystickTouchId = null;
  let joyOrigin = { x: 0, y: 0 };
  let moveVec = { x: 0, y: 0 };
  let lookVec = { x: 0, y: 0 }; // 右摇杆或鼠标视角向量（战斗机俯仰控制用）
  const maxJoyDist = 50;

  joystickZone.addEventListener('touchstart', (e) => {
    if (joystickActive) return;
    const t = e.changedTouches[0];
    joystickActive = true;
    joystickTouchId = t.identifier;
    joyOrigin = { x: t.clientX, y: t.clientY };
    joystickBase.style.display = 'block';
    joystickBase.style.left = (t.clientX - 50) + 'px';
    joystickBase.style.top = (t.clientY - 50) + 'px';
    joystickStick.style.left = '27px';
    joystickStick.style.top = '27px';
  }, { passive: true });

  joystickZone.addEventListener('touchmove', (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier !== joystickTouchId) continue;
      let dx = t.clientX - joyOrigin.x, dy = t.clientY - joyOrigin.y;
      const dist = Math.min(Math.hypot(dx, dy), maxJoyDist);
      const angle = Math.atan2(dy, dx);
      const sx = Math.cos(angle) * dist, sy = Math.sin(angle) * dist;
      joystickStick.style.left = (27 + sx) + 'px';
      joystickStick.style.top = (27 + sy) + 'px';
      moveVec.x = sx / maxJoyDist; moveVec.y = sy / maxJoyDist;
    }
  }, { passive: true });

  function endJoystick(e) {
    for (const t of e.changedTouches) {
      if (t.identifier !== joystickTouchId) continue;
      joystickActive = false; joystickTouchId = null;
      joystickBase.style.display = 'none';
      moveVec.x = 0; moveVec.y = 0;
    }
  }
  joystickZone.addEventListener('touchend', endJoystick, { passive: true });
  joystickZone.addEventListener('touchcancel', endJoystick, { passive: true });

  // =========================================================
  // 触屏视角控制
  // =========================================================
  const lookZone = document.getElementById('lookZone');
  let lookTouchId = null;
  let lastLook = { x: 0, y: 0 };
  const lookSensitivity = 0.0032;

  lookZone.addEventListener('touchstart', (e) => {
    if (lookTouchId !== null) return;
    const t = e.changedTouches[0];
    lookTouchId = t.identifier;
    lastLook = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  lookZone.addEventListener('touchmove', (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier !== lookTouchId) continue;
      const dx = t.clientX - lastLook.x, dy = t.clientY - lastLook.y;
      lastLook = { x: t.clientX, y: t.clientY };
      
      if (isDriving && currentVehicle && currentVehicle.type === 'jet') {
        // 战斗机：右摇杆水平控制转向，竖直控制俯仰
        lookVec.x = Math.max(-1, Math.min(1, dx * lookSensitivity * 150)); // 水平转向
        lookVec.y = Math.max(-1, Math.min(1, -dy * lookSensitivity * 150)); // 竖直俯仰：向上滑爬升，向下滑俯冲
      } else {
        // 普通情况：摄像机自由视角
        yawObject.rotation.y -= dx * currentLookSensitivity();
        pitchObject.rotation.x -= dy * currentLookSensitivity();
        pitchObject.rotation.x = Math.max(-Math.PI / 2.3, Math.min(Math.PI / 2.3, pitchObject.rotation.x));
        lookVec.x = 0; lookVec.y = 0;
      }
    }
  }, { passive: true });

  function endLook(e) {
    for (const t of e.changedTouches) { 
      if (t.identifier === lookTouchId) {
        lookTouchId = null;
        lookVec.x = 0; lookVec.y = 0; // 松开摇杆，清除视角输入
      }
    }

  lookZone.addEventListener('touchend', endLook, { passive: true });
  lookZone.addEventListener('touchcancel', endLook, { passive: true });

  // =========================================================
  // 开火 / 跳跃 / 换弹 / 换枪 按钮

  const jumpBtn = document.getElementById('jumpBtn');

  function reload() {

    player.reloading = true;
