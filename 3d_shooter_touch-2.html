  // =========================================================
  // 可见子弹（曳光弹）
  // =========================================================
  const bulletsGroup = new THREE.Group();
  scene.add(bulletsGroup);
  const bulletMatCache = new Map();
  function getBulletMat(color) {
    if (!bulletMatCache.has(color)) bulletMatCache.set(color, new THREE.MeshBasicMaterial({ color }));
    return bulletMatCache.get(color);
  }
  const activeBullets = [];

  function spawnBullet(startPos, endPos, color, speed, tracerScale) {
    const dir = new THREE.Vector3().subVectors(endPos, startPos);
    const dist = dir.length() || 0.001;
    dir.normalize();
    // tracerScale 用于放大曳光弹。战斗机/载具的射击是在十几米外的追尾视角看的，
    // 步兵那种 0.022 半径的细弹芯在这个距离上几乎不可见，会让人以为"根本没射出去"。
    const s = tracerScale || 1;
    const h = Math.min(0.55 * s, dist);
    const geo = new THREE.CylinderGeometry(0.022 * s, 0.022 * s, h, 6);
    const mesh = new THREE.Mesh(geo, getBulletMat(color));
    const quat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    mesh.quaternion.copy(quat);
    mesh.position.copy(startPos).addScaledVector(dir, h / 2);
    bulletsGroup.add(mesh);
    activeBullets.push({ mesh, dir, startPos: startPos.clone(), traveled: 0, totalDist: dist, halfH: h / 2, speed: speed || 95 });
  }

  function updateBullets(dt) {
    for (let i = activeBullets.length - 1; i >= 0; i--) {
      const b = activeBullets[i];
      b.traveled += b.speed * dt;
      if (b.traveled >= b.totalDist) {
        bulletsGroup.remove(b.mesh); b.mesh.geometry.dispose();
        activeBullets.splice(i, 1);
        continue;
      }
      b.mesh.position.copy(b.startPos).addScaledVector(b.dir, b.traveled + b.halfH);
    }
  }

  // =========================================================
  // 手榴弹 / 榴弹炮：抛射物理 + 范围爆炸
  // =========================================================
  const grenadeMatCache = new Map();
  function getGrenadeMat(color) {
    if (!grenadeMatCache.has(color)) grenadeMatCache.set(color, new THREE.MeshStandardMaterial({ color, roughness: 0.6 }));
    return grenadeMatCache.get(color);
  }
  function createGrenadeMesh(weapon) {
    const geo = weapon.explodeOnImpact ? new THREE.CylinderGeometry(0.06, 0.06, 0.16, 8) : new THREE.SphereGeometry(0.09, 10, 10);
    const mesh = new THREE.Mesh(geo, getGrenadeMat(weapon.color));
    if (weapon.explodeOnImpact) mesh.rotation.x = Math.PI / 2;
    return mesh;
  }

  const activeGrenades = [];
  function throwGrenade(weapon) {
    camera.getWorldPosition(camWorldPos);
    camera.getWorldDirection(camWorldDir);
    const mo = muzzleOffsets[currentWeaponIndex];
    const startPos = mo.clone().applyMatrix4(camera.matrixWorld);
    const velocity = camWorldDir.clone().multiplyScalar(weapon.throwSpeed);
    velocity.y += 3.2;
    const mesh = createGrenadeMesh(weapon);
    mesh.position.copy(startPos);
    scene.add(mesh);
    activeGrenades.push({ mesh, velocity, weapon, timer: weapon.fuseTime });
  }

  // 坦克炮弹：与榴弹炮共用同一套抛射/爆炸逻辑，但弹道更平直、射程更远、爆炸威力更强
  function launchTankShell(v, direction) {
    const facing = direction.clone().normalize();
    let muzzlePos;
    if (v.mesh.userData.barrelPivot) {
      muzzlePos = new THREE.Vector3();
      v.mesh.userData.barrelPivot.getWorldPosition(muzzlePos);
      muzzlePos.addScaledVector(facing, 2.7);
    } else {
      muzzlePos = v.mesh.position.clone().addScaledVector(facing, 3.6).add(new THREE.Vector3(0, 1.3, 0));
    }
    // 注：不再额外叠加向上的初速度分量——facing 本身已经带有炮管俯仰角度，
    // 之前多加的 velocity.y += 1.3 会让炮弹实际弹道比瞄准点更高，平射时经常直接从目标头顶飞过去，
    // 看起来就像"打了没反应"。现在弹道严格沿着瞄准方向出膛，指哪打哪。
    const velocity = facing.clone().multiplyScalar(v.cfg.shellSpeed);
    const shellWeapon = {
      color: v.cfg.shellColor, explodeOnImpact: true,
      splashRadius: v.cfg.shellSplashRadius, splashDamage: v.cfg.shellSplashDamage
    };
    const mesh = createGrenadeMesh(shellWeapon);
    mesh.position.copy(muzzlePos);
    scene.add(mesh);
    // sourceVehicle 记录是谁发射的这发炮弹，命中检测和爆炸溅射都要把它排除掉——
    // 否则炮口和炮塔本身的碰撞半径几乎正好卡在炮弹出膛的位置，平射时炮弹一出膛就判定命中自己，
    // 下压俯射时更是直接命中脚下地面、溅射伤害波及自己，等于把自己炸了
    // armDelay：出膛后一小段时间内（约走完6-7个单位）完全跳过命中判定，相当于炮弹的"保险距离"，
    // 从根源上避免下压射击时刚出膛就在自己脚边触发地面/自身命中
    activeGrenades.push({ mesh, velocity, weapon: shellWeapon, timer: 0, gravityMult: v.cfg.shellGravityMult, sourceVehicle: v, armDelay: 0.12 });
  }

  // NPC（敌军/友军）投掷手雷或榴弹炮弹，复用同一套抛射/爆炸物理
  function npcThrowExplosive(originPos, targetPos, profile) {
    const dir = new THREE.Vector3(targetPos.x - originPos.x, 0, targetPos.z - originPos.z);
    const flatDist = dir.length() || 0.001;
    dir.normalize();
    const velocity = dir.clone().multiplyScalar(profile.throwSpeed);
    velocity.y += profile.explodeOnImpact ? 1.3 : 3.0;
    const weaponLike = {
      color: profile.gunColor, explodeOnImpact: profile.explodeOnImpact,
      splashRadius: profile.splashRadius, splashDamage: profile.splashDamage
    };
    const mesh = createGrenadeMesh(weaponLike);
    mesh.position.copy(originPos);
    scene.add(mesh);
    activeGrenades.push({ mesh, velocity, weapon: weaponLike, timer: profile.fuseTime, gravityMult: profile.gravityMult });
  }

  // 取炮口的真实朝向（世界坐标）。
  // 注意：Object3D.getWorldDirection() 返回的是物体的 +Z 轴，而炮管模型是沿 -Z 架设的
  // （barrel.position.z = -1.6，炮塔瞄准也统一按 -Z 为正前方计算）。
  // 直接用 getWorldDirection() 会拿到正后方，炮弹就朝车屁股后面飞出去了 —— 表现就是"炮弹射不出来"。
  const _barrelDirTmp = new THREE.Vector3();
  function getBarrelForward(v, target) {
    const out = target || new THREE.Vector3();
    const pivot = v.mesh.userData.barrelPivot;
    if (!pivot) {
      // 没有炮管枢轴时退化为车体正前方
      return out.set(-Math.sin(v.yaw), 0, -Math.cos(v.yaw)).normalize();
    }
    pivot.getWorldDirection(_barrelDirTmp);
    return out.copy(_barrelDirTmp).negate().normalize();
  }

  // 让坦克炮塔水平转向 + 炮管上下俯仰，对准给定的世界坐标方向
  function aimTankTurret(v, worldAimDir) {
    if (!v.mesh.userData.turretPivot) return;
    const flatLen = Math.hypot(worldAimDir.x, worldAimDir.z) || 0.0001;
    const aimYaw = Math.atan2(-worldAimDir.x, -worldAimDir.z);
    let turretYaw = aimYaw - v.yaw;
    while (turretYaw > Math.PI) turretYaw -= Math.PI * 2;
    while (turretYaw < -Math.PI) turretYaw += Math.PI * 2;
    v.mesh.userData.turretPivot.rotation.y = turretYaw;
    const pitch = Math.atan2(worldAimDir.y, flatLen);
    v.mesh.userData.barrelPivot.rotation.x = Math.max(-0.35, Math.min(0.45, pitch));
  }

  const explosionEffects = [];
  const explosionGeoFull = new THREE.SphereGeometry(0.3, 12, 12);
  const explosionGeoLite = new THREE.SphereGeometry(0.3, 6, 5); // 低面数版本，斯大林格勒高密度战斗下使用
  function spawnExplosion(pos, radius) {
    const lite = mapType === 'stalingrad';
    const mesh = new THREE.Mesh(lite ? explosionGeoLite : explosionGeoFull, new THREE.MeshBasicMaterial({ color: 0xffaa33, transparent: true, opacity: 0.9 }));
    mesh.position.copy(pos);
    scene.add(mesh);
    let light = null;
    if (!lite) {
      light = new THREE.PointLight(0xffaa33, 4, radius * 3);
      light.position.copy(pos);
      scene.add(light);
    }
    explosionEffects.push({ mesh, light, t: 0, duration: lite ? 0.28 : 0.4, maxScale: (radius * 0.9) / 0.3 });
    // 点光源是渲染开销最大的部分，斯大林格勒同时爆炸数量多，直接省去；烟雾也从3个减到1个
    const smokeCount = lite ? 1 : 3;
    for (let i = 0; i < smokeCount; i++) spawnSmoke(pos.clone().add(new THREE.Vector3((Math.random() - 0.5) * radius * 0.6, 0, (Math.random() - 0.5) * radius * 0.6)));
  }
  function updateExplosions(dt) {
    for (let i = explosionEffects.length - 1; i >= 0; i--) {
      const e = explosionEffects[i];
      e.t += dt;
      const k = Math.min(1, e.t / e.duration);
      const scale = 1 + k * e.maxScale;
      e.mesh.scale.setScalar(scale);
      e.mesh.material.opacity = Math.max(0, 0.9 * (1 - k));
      if (e.light) e.light.intensity = Math.max(0, 4 * (1 - k));
      if (k >= 1) {
        scene.remove(e.mesh); e.mesh.material.dispose(); // 几何体是共享缓存，不 dispose
        if (e.light) scene.remove(e.light);
        explosionEffects.splice(i, 1);
      }
    }
  }

  const smokeEffects = [];
  const smokeGeoShared = new THREE.SphereGeometry(0.4, 6, 5);
  function spawnSmoke(pos) {
    const mesh = new THREE.Mesh(smokeGeoShared, new THREE.MeshBasicMaterial({ color: 0x555550, transparent: true, opacity: 0.5 }));
    mesh.position.copy(pos); mesh.position.y += 0.2;
    scene.add(mesh);
    const dur = mapType === 'stalingrad' ? 1.1 + Math.random() * 0.4 : 2.2 + Math.random() * 0.8;
    smokeEffects.push({ mesh, t: 0, duration: dur });
  }
  function updateSmoke(dt) {
    for (let i = smokeEffects.length - 1; i >= 0; i--) {
      const s = smokeEffects[i];
      s.t += dt;
      const k = s.t / s.duration;
      s.mesh.position.y += dt * 0.5;
      s.mesh.scale.setScalar(1 + k * 2.6);
      s.mesh.material.opacity = Math.max(0, 0.5 * (1 - k));
      if (k >= 1) {
        scene.remove(s.mesh); s.mesh.material.dispose(); // 几何体是共享缓存，不 dispose
        smokeEffects.splice(i, 1);
      }
    }
  }

  function explodeGrenade(g) {
    const pos = g.mesh.position.clone();
    spawnExplosion(pos, g.weapon.splashRadius);
    scene.remove(g.mesh);

    enemies.forEach(en => {
      if (!en.alive || en.inVehicle) return;
      const d = pos.distanceTo(en.mesh.position);
      if (d < g.weapon.splashRadius) {
        const dmg = g.weapon.splashDamage * (1 - d / g.weapon.splashRadius);
        const dir = new THREE.Vector3().subVectors(en.mesh.position, pos).normalize();
        if (en.hp - dmg <= 0) { killEnemy(en, dir); } else { en.hp -= dmg; flashEnemyHit(en, false); knockbackEnemy(en, dir); }
      }
    });
    friendlies.forEach(f => {
      if (!f.alive || f.inVehicle) return;
      const d = pos.distanceTo(f.mesh.position);
      if (d < g.weapon.splashRadius) {
        const dmg = g.weapon.splashDamage * (1 - d / g.weapon.splashRadius);
        const dir = new THREE.Vector3().subVectors(f.mesh.position, pos).normalize();
        if (f.hp - dmg <= 0) { killFriendly(f, dir); } else { f.hp -= dmg; flashEnemyHit(f, false); }
      }
    });
    vehicles.forEach(v => {
      if (v === g.sourceVehicle) return; // 排除发射者自己，炮弹不会反过来炸毁发射它的载具
      const d = pos.distanceTo(v.mesh.position);
      if (d < g.weapon.splashRadius) {
        v.hp -= g.weapon.splashDamage * 1.4 * (1 - d / g.weapon.splashRadius);
        if (v.hp <= 0) explodeVehicle(v);
      }
    });

    // 如果玩家此刻仍在发射这发炮弹的载具里（比如自己开的坦克），也一并排除，避免溅射伤害穿透打到自己
    const playerIsSourceDriver = g.sourceVehicle && g.sourceVehicle.occupant && g.sourceVehicle.occupant.list === 'player';
    const distToPlayer = pos.distanceTo(yawObject.position);
    if (!playerIsSourceDriver && distToPlayer < g.weapon.splashRadius) {
      const dmg = g.weapon.splashDamage * 0.7 * (1 - distToPlayer / g.weapon.splashRadius);
      damageEntity('player', null, dmg);
      shakeMag = Math.min(0.4, shakeMag + 0.18);
    } else if (distToPlayer < g.weapon.splashRadius * 1.6) {
      shakeMag = Math.min(0.3, shakeMag + 0.08);
    }
  }

  function updateGrenades(dt) {
    for (let i = activeGrenades.length - 1; i >= 0; i--) {
      const g = activeGrenades[i];
      g.velocity.y += gravity * dt * (g.gravityMult !== undefined ? g.gravityMult : 1.15);
      g.mesh.position.addScaledVector(g.velocity, dt);
      g.mesh.rotation.x += dt * 6;
      g.mesh.rotation.y += dt * 4;

      // 保险距离：出膛后这段时间内完全跳过命中判定，只飞行不检测碰撞，避免刚出膛就在发射者自己脚边爆炸
      if (g.armDelay > 0) { g.armDelay -= dt; continue; }

      const groundY = getGroundHeight(g.mesh.position.x, g.mesh.position.z);
      let hit = false;
      if (g.mesh.position.y <= groundY + 0.12) {
        g.mesh.position.y = groundY + 0.12;
        if (g.weapon.explodeOnImpact) hit = true;
        else { g.velocity.y *= -0.35; g.velocity.x *= 0.6; g.velocity.z *= 0.6; }
      }
      if (!hit && g.weapon.explodeOnImpact) {
        for (const en of enemies) {
          if (en.alive && !en.inVehicle && g.mesh.position.distanceTo(en.mesh.position) < 0.6) { hit = true; break; }
        }
      }
      if (!hit && g.weapon.explodeOnImpact) {
        for (const f of friendlies) {
          if (f.alive && !f.inVehicle && g.mesh.position.distanceTo(f.mesh.position) < 0.6) { hit = true; break; }
        }
      }
      if (!hit && g.weapon.explodeOnImpact) {
        for (const v of vehicles) {
          if (v === g.sourceVehicle) continue; // 排除发射者自己，避免刚出膛就命中自身
          if (g.mesh.position.distanceTo(v.mesh.position) < v.cfg.collideR + 0.6) { hit = true; break; }
        }
      }
      if (!hit && g.weapon.explodeOnImpact && collidesAt(g.mesh.position.x, g.mesh.position.z, 0.15)) {
        hit = true;
      }
      if (!hit && !g.weapon.explodeOnImpact) {
        g.timer -= dt;
        if (g.timer <= 0) hit = true;
      }
      if (hit) {
        explodeGrenade(g);
        activeGrenades.splice(i, 1);
      }
    }
  }

  // =========================================================
  // 射击逻辑
  // =========================================================
  const raycaster = new THREE.Raycaster();
  const camWorldPos = new THREE.Vector3();
  const camWorldDir = new THREE.Vector3();
  const camWorldQuat = new THREE.Quaternion();

  function getSpreadDirection(baseDir, spread) {
    if (spread <= 0) return baseDir.clone();
    camera.getWorldQuaternion(camWorldQuat);
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camWorldQuat);
    const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camWorldQuat);
    const jitterX = (Math.random() - 0.5) * spread;
    const jitterY = (Math.random() - 0.5) * spread;
    return baseDir.clone().addScaledVector(right, jitterX).addScaledVector(up, jitterY).normalize();
  }

  function fireOnePellet(weapon) {
    camera.getWorldPosition(camWorldPos);
    camera.getWorldDirection(camWorldDir);
    const dir = getSpreadDirection(camWorldDir, weapon.spread * currentSpreadMultiplier());
    raycaster.set(camWorldPos, dir);

    const hitMeshes = [];
    enemies.forEach(en => { if (en.alive && !en.inVehicle) hitMeshes.push(en.mesh.userData.headMesh, en.mesh.userData.bodyMesh); });
    vehicles.forEach(v => {
      if (v === currentVehicle) return;
      if (v.occupant && v.occupant.list === 'friendly') return;
      hitMeshes.push(v.mesh.userData.hullMesh);
    });
    if (isBoundedMap()) hitMeshes.push(...mazeWallMeshes);
    const intersects = raycaster.intersectObjects(hitMeshes, false);

    const mo = muzzleOffsets[currentWeaponIndex];
    const muzzlePos = mo.clone().applyMatrix4(camera.matrixWorld);

    let targetPoint;
    if (intersects.length > 0) {
      const hitObj = intersects[0].object;
      targetPoint = intersects[0].point;
      if (hitObj.userData.isMazeWall) {
        // 打在墙上：子弹曳光弹停在撞击点，不造成伤害
      } else if (hitObj.userData.vehicleRef) {
        const v = hitObj.userData.vehicleRef;
        showHitMarker();
        const vMult = weapon.antiVehicleMultiplier
          ? (v.type === 'jet' ? weapon.antiVehicleMultiplier * 1.3 : weapon.antiVehicleMultiplier)
          : 1.3;
        v.hp -= weapon.damage * vMult;
        if (v.hp <= 0) explodeVehicle(v);
      } else {
        const enemy = enemies.find(en => en.alive && (en.mesh.userData.headMesh === hitObj || en.mesh.userData.bodyMesh === hitObj));
        if (enemy) {
          const dmg = (hitObj === enemy.mesh.userData.headMesh) ? weapon.damage * 2.4 : weapon.damage;
          enemy.hp -= dmg;
          const isKill = enemy.hp <= 0;
          showHitMarker();
          flashEnemyHit(enemy, isKill);
          knockbackEnemy(enemy, dir);
          if (isKill && enemy.alive) killEnemy(enemy, dir);
        }
      }
    } else {
      targetPoint = raycaster.ray.origin.clone().addScaledVector(raycaster.ray.direction, 70);
    }
    if (weapon.explosiveRounds) triggerRoundExplosion(targetPoint, weapon);
    spawnBullet(muzzlePos, targetPoint, weapon.color, weapon.bulletSpeed);
  }

  // 爆炸弹药：子弹落点处产生小范围爆炸特效与溅射伤害（不伤及玩家自身，避免连发武器误伤自己）
  function triggerRoundExplosion(pos, weapon) {
    spawnExplosion(pos.clone(), weapon.explosionRadius);
    enemies.forEach(en => {
      if (!en.alive || en.inVehicle) return;
      const d = pos.distanceTo(en.mesh.position);
      if (d < weapon.explosionRadius) {
        const dmg = weapon.explosionDamage * (1 - d / weapon.explosionRadius);
        if (en.hp - dmg <= 0) killEnemy(en, new THREE.Vector3().subVectors(en.mesh.position, pos).normalize());
        else { en.hp -= dmg; flashEnemyHit(en, false); }
      }
    });
    friendlies.forEach(f => {
      if (!f.alive || f.inVehicle) return;
      const d = pos.distanceTo(f.mesh.position);
      if (d < weapon.explosionRadius) {
        const dmg = weapon.explosionDamage * (1 - d / weapon.explosionRadius);
        if (f.hp - dmg <= 0) killFriendly(f, new THREE.Vector3().subVectors(f.mesh.position, pos).normalize());
        else { f.hp -= dmg; flashEnemyHit(f, false); }
      }
    });
  }

  // 车顶机枪（第二乘员）：命中判定用射线，弹道曳光从机枪支座打出
  function vehicleGunnerShoot(v) {
    camera.getWorldPosition(camWorldPos);
    camera.getWorldDirection(camWorldDir);
    raycaster.set(camWorldPos, camWorldDir);

    const hitMeshes = [];
    enemies.forEach(en => { if (en.alive && !en.inVehicle) hitMeshes.push(en.mesh.userData.headMesh, en.mesh.userData.bodyMesh); });
    vehicles.forEach(ov => {
      if (ov === v) return;
      if (ov.occupant && ov.occupant.list === 'friendly') return;
      if (ov.mesh.userData.hullMesh) hitMeshes.push(ov.mesh.userData.hullMesh);
    });
    if (isBoundedMap()) hitMeshes.push(...mazeWallMeshes);
    const intersects = raycaster.intersectObjects(hitMeshes, false);

    const dmg = v.cfg.gunnerDamage;
    let targetPoint;
    if (intersects.length > 0) {
      const hitObj = intersects[0].object;
      targetPoint = intersects[0].point;
      if (hitObj.userData.isMazeWall) {
        // 打在墙上，无伤害
      } else if (hitObj.userData.vehicleRef) {
        const ov = hitObj.userData.vehicleRef;
        showHitMarker();
        ov.hp -= dmg * 0.5; // 机枪对载具装甲效果有限
        if (ov.hp <= 0) explodeVehicle(ov);
      } else {
        const enemy = enemies.find(en => en.alive && (en.mesh.userData.headMesh === hitObj || en.mesh.userData.bodyMesh === hitObj));
        if (enemy) {
          showHitMarker();
          if (enemy.hp - dmg <= 0) killEnemy(enemy, camWorldDir.clone());
          else { enemy.hp -= dmg; flashEnemyHit(enemy, false); }
        }
      }
    } else {
      targetPoint = camWorldPos.clone().addScaledVector(camWorldDir, 110);
    }

    // 曳光弹起点取机枪支座的世界位置，并沿视线方向前推一点，避免曳光线被自己的车体挡住
    const muzzlePos = new THREE.Vector3();
    if (v.mesh.userData.gunnerMount) v.mesh.userData.gunnerMount.getWorldPosition(muzzlePos);
    else muzzlePos.copy(v.mesh.position).add(new THREE.Vector3(0, 2.0, 0));
    muzzlePos.addScaledVector(camWorldDir, 0.9);

    spawnBullet(muzzlePos, targetPoint, v.cfg.gunnerBulletColor, v.cfg.gunnerBulletSpeed);
    applyRecoil({ recoil: v.cfg.gunnerRecoil, shake: v.cfg.gunnerShake });
  }

  function vehicleTryShoot() {
    const v = currentVehicle;
    if (!v || !player.alive) return;

    // 车顶机枪位：使用独立的冷却/伤害配置，不占用也不触发主炮
    // （之前机枪手按开火键会走到主炮分支，既抢了主炮的冷却，又把炮塔硬拽到机枪手的视线方向）
    if (playerSeat === 'gunner' && v.cfg.gunnerFireRate) {
      if (v.gunnerFireCooldown > 0) return;
      v.gunnerFireCooldown = v.cfg.gunnerFireRate;
      vehicleGunnerShoot(v);
      return;
    }

    if (!v.cfg.canFire) return;
    if (v.fireCooldown > 0) return;
    v.fireCooldown = v.cfg.fireRate;

    if (v.type === 'tank') {
      camera.getWorldDirection(camWorldDir);
      aimTankTurret(v, camWorldDir);
      const barrelDir = getBarrelForward(v);
      launchTankShell(v, barrelDir);
      applyRecoil({ recoil: v.cfg.recoil, shake: v.cfg.shake });
      return;
    }

    // 战斗机机枪：每次只打【一发】，靠极高射速形成连续弹流。
    // 一次性同时打出 100 发会变成一坨齐射，看起来就是"一炮"，那不是机枪。
    // 真正的机枪 = 一条 100 发的弹链，按住开火键以 0.05 秒/发的节奏泼出去，打空后换弹。
    if (v.type === 'jet') {
      if (v.jetReload > 0) return;          // 换弹中
      if (v.jetAmmo <= 0) {                  // 弹链打空，进入换弹
        v.jetReload = v.cfg.jetReloadTime;
        v.jetAmmo = v.cfg.jetMagSize;
        return;
      }
      v.jetAmmo--;

      const jetHeadingDir = new THREE.Vector3(
        -Math.sin(v.yaw) * Math.cos(v.pitch),
        Math.sin(v.pitch),
        -Math.cos(v.yaw) * Math.cos(v.pitch)
      ).normalize();

      // 两侧机翼交替吐弹，视觉上更像双管机枪
      const side = (v.jetAmmo % 2 === 0) ? 1 : -1;
      const rightVec = new THREE.Vector3(-Math.cos(v.yaw), 0, Math.sin(v.yaw));
      const muzzlePos = v.mesh.position.clone()
        .addScaledVector(jetHeadingDir, 3.2)
        .addScaledVector(rightVec, side * 1.1);

      // 单发的轻微散布
      const spread = 0.012;
      const dir = jetHeadingDir.clone().add(new THREE.Vector3(
        (Math.random() - 0.5) * spread,
        (Math.random() - 0.5) * spread,
        (Math.random() - 0.5) * spread
      )).normalize();

      raycaster.set(muzzlePos, dir);
      const hitMeshes = [];
      enemies.forEach(en => { if (en.alive && !en.inVehicle) hitMeshes.push(en.mesh.userData.headMesh, en.mesh.userData.bodyMesh); });
      vehicles.forEach(ov => {
        if (ov === v) return;
        if (ov.occupant && ov.occupant.list === 'friendly') return;
        if (ov.mesh.userData.hullMesh) hitMeshes.push(ov.mesh.userData.hullMesh);
      });
      if (isBoundedMap()) hitMeshes.push(...mazeWallMeshes);
      const intersects = raycaster.intersectObjects(hitMeshes, false);

      let targetPoint;
      if (intersects.length > 0) {
        const hitObj = intersects[0].object;
        targetPoint = intersects[0].point;
        if (!hitObj.userData.isMazeWall) {
          if (hitObj.userData.vehicleRef) {
            const ov = hitObj.userData.vehicleRef;
            showHitMarker();
            ov.hp -= v.cfg.gunDamage * 0.4; // 机枪对装甲伤害有限
            if (ov.hp <= 0) explodeVehicle(ov);
          } else {
            const enemy = enemies.find(en => en.alive && (en.mesh.userData.headMesh === hitObj || en.mesh.userData.bodyMesh === hitObj));
            if (enemy) {
              showHitMarker();
              if (enemy.hp - v.cfg.gunDamage <= 0) killEnemy(enemy, dir.clone());
              else { enemy.hp -= v.cfg.gunDamage; flashEnemyHit(enemy, false); }
            }
          }
        }
      } else {
        targetPoint = muzzlePos.clone().addScaledVector(dir, 250);
      }
      spawnBullet(muzzlePos, targetPoint, v.cfg.bulletColor, v.cfg.bulletSpeed, 6); // 粗曳光，追尾视角下清晰可见
      applyRecoil({ recoil: v.cfg.recoil, shake: v.cfg.shake });
      return;
    }

    camera.getWorldPosition(camWorldPos);
    camera.getWorldDirection(camWorldDir);
    raycaster.set(camWorldPos, camWorldDir);

    const hitMeshes = [];
    enemies.forEach(en => { if (en.alive && !en.inVehicle) hitMeshes.push(en.mesh.userData.headMesh, en.mesh.userData.bodyMesh); });
    vehicles.forEach(ov => {
      if (ov === v) return;
      if (ov.occupant && ov.occupant.list === 'friendly') return;
      hitMeshes.push(ov.mesh.userData.hullMesh);
    });
    if (isBoundedMap()) hitMeshes.push(...mazeWallMeshes);
    const intersects = raycaster.intersectObjects(hitMeshes, false);

    // 曳光弹从载具本体前方发射（而非远在车后的第三人称相机位置），保证弹道在画面中可见
    const facing = new THREE.Vector3(-Math.sin(v.yaw) * Math.cos(v.pitch || 0), Math.sin(v.pitch || 0), -Math.cos(v.yaw) * Math.cos(v.pitch || 0));
    const muzzlePos = v.mesh.position.clone()
      .addScaledVector(facing, v.cfg.flying ? 3.2 : 3.6)
      .add(new THREE.Vector3(0, v.cfg.flying ? 0 : 1.3, 0));

    let targetPoint;
    if (intersects.length > 0) {
      const hitObj = intersects[0].object;
      targetPoint = intersects[0].point;
      if (hitObj.userData.isMazeWall) {
        // 打在墙上，无伤害
      } else if (hitObj.userData.vehicleRef) {
        const ov = hitObj.userData.vehicleRef;
        showHitMarker();
        ov.hp -= v.cfg.gunDamage * 1.4;
        if (ov.hp <= 0) explodeVehicle(ov);
      } else {
        const enemy = enemies.find(en => en.alive && (en.mesh.userData.headMesh === hitObj || en.mesh.userData.bodyMesh === hitObj));
        if (enemy) {
          showHitMarker();
          if (enemy.hp - v.cfg.gunDamage <= 0) { killEnemy(enemy, camWorldDir.clone()); }
          else { enemy.hp -= v.cfg.gunDamage; flashEnemyHit(enemy, false); }
        }
      }
    } else {
      targetPoint = camWorldPos.clone().addScaledVector(camWorldDir, 110);
    }
    spawnBullet(muzzlePos, targetPoint, v.cfg.bulletColor, v.cfg.bulletSpeed);
    applyRecoil({ recoil: v.cfg.recoil, shake: v.cfg.shake });
  }

  function tryShoot() {
    if (isDriving) { vehicleTryShoot(); return; }
    if (!player.alive || player.reloading) return;
    if (fireCooldown > 0) return;
    const weapon = weapons[currentWeaponIndex];
    if (player.weaponsAmmo[currentWeaponIndex] <= 0) {
      reloadHint.style.display = 'block';
      return;
    }
    fireCooldown = weapon.fireRate;
    player.weaponsAmmo[currentWeaponIndex]--;
    updateHud();
    if (player.weaponsAmmo[currentWeaponIndex] === 0) reloadHint.style.display = 'block';

    applyRecoil(weapon);
    if (weapon.isGrenade) {
      throwGrenade(weapon);
    } else {
      for (let p = 0; p < weapon.pellets; p++) fireOnePellet(weapon);
    }
  }

  function killEnemy(enemy, hitDir) {
    enemy.alive = false;
    player.score++;
    updateHud();
    startDeathEffect(enemy.mesh, hitDir || new THREE.Vector3(0, 0, 1));
  }

  function killFriendly(friendly, hitDir) {
    friendly.alive = false;
    friendlyDeathCount++;
    updateHud();
    startDeathEffect(friendly.mesh, hitDir || new THREE.Vector3(0, 0, 1));
  }

  // 统一伤害入口：若目标正在载具内，优先扣除载具耐久；否则扣角色血量
  function damageEntity(kind, ref, dmg, hitDir) {
    let vehicle = null;
    if (kind === 'player') { if (isDriving) vehicle = currentVehicle; }
    else if (ref && ref.vehicle) vehicle = ref.vehicle;

    if (vehicle) {
      vehicle.hp -= dmg;
      if (vehicle.hp <= 0) explodeVehicle(vehicle);
      return;
    }
    if (kind === 'player') {
      if (player.invulnerable) return;
      player.hp -= dmg;
      player.regenDelay = REGEN_DELAY_AFTER_HIT;
      flashHit();
      if (player.hp <= 0) { player.hp = 0; gameOver(); }
      updateHud();
    } else if (kind === 'friendly') {
      ref.hp -= dmg;
      if (ref.hp <= 0) killFriendly(ref, hitDir); else flashEnemyHit(ref, false);
    } else if (kind === 'enemy') {
      ref.hp -= dmg;
      if (ref.hp <= 0) killEnemy(ref, hitDir); else flashEnemyHit(ref, false);
    }
  }

  // 死亡表现入口：斯大林格勒人口密度高、同时阵亡的人数多，改用极轻量的整体倒地+淡出效果；
  // 其余地图密度较低，保留原本的分肢布娃娃物理效果
  function startDeathEffect(mesh, hitDir) {
    if (mapType === 'stalingrad') startSimpleDeath(mesh);
    else startRagdoll(mesh, hitDir);
  }

  const simpleDeaths = [];
  function startSimpleDeath(mesh) {
    mesh.traverse(o => { if (o.material) { o.material = o.material.clone(); o.material.transparent = true; } });
    simpleDeaths.push({
      mesh, t: 0, startY: mesh.position.y,
      fallSign: Math.random() < 0.5 ? 1 : -1, fallAxis: Math.random() < 0.5 ? 'x' : 'z'
    });
  }
  function updateSimpleDeaths(dt) {
    for (let i = simpleDeaths.length - 1; i >= 0; i--) {
      const d = simpleDeaths[i];
      d.t += dt;
      const k = Math.min(1, d.t / 0.45);
      const fallAngle = d.fallSign * k * 1.4;
      if (d.fallAxis === 'x') d.mesh.rotation.x = fallAngle; else d.mesh.rotation.z = fallAngle;
      d.mesh.position.y = d.startY - k * 0.35;
      if (d.t > 3.2) {
        const fadeK = Math.min(1, (d.t - 3.2) / 0.7);
        d.mesh.traverse(o => { if (o.material) o.material.opacity = 1 - fadeK; });
        if (fadeK >= 1) {
          scene.remove(d.mesh);
          d.mesh.traverse(o => { if (o.material) o.material.dispose(); });
          simpleDeaths.splice(i, 1);
        }
      }
    }
  }

  function startRagdoll(mesh, hitDir) {
    const parts = [
      mesh.userData.bodyMesh, mesh.userData.headMesh,
      mesh.userData.armL, mesh.userData.armR,
      mesh.userData.legL, mesh.userData.legR,
      mesh.userData.gunMesh
    ];
    const pieces = [];
    parts.forEach(part => {
      if (!part) return;
      scene.attach(part); // 保留世界坐标，脱离原骨架，独立成为可物理模拟的碎片
      const vel = hitDir.clone().multiplyScalar(1.5 + Math.random() * 2.2);
      vel.y += 2.2 + Math.random() * 2.2;
      vel.x += (Math.random() - 0.5) * 2.2;
      vel.z += (Math.random() - 0.5) * 2.2;
      const angVel = new THREE.Vector3((Math.random() - 0.5) * 9, (Math.random() - 0.5) * 9, (Math.random() - 0.5) * 9);
      part.traverse(o => { if (o.material) { o.material = o.material.clone(); o.material.transparent = true; o.material.emissiveIntensity = 0; } });
      pieces.push({ mesh: part, vel, angVel, landed: false, landTimer: 0 });
    });
    scene.remove(mesh);
    ragdolls.push({ pieces, t: 0 });
  }

  function updateRagdolls(dt) {
    for (let i = ragdolls.length - 1; i >= 0; i--) {
      const r = ragdolls[i];
      r.t += dt;
      r.pieces.forEach(p => {
        if (!p.landed) {
          p.vel.y += gravity * dt * 0.55;
          p.mesh.position.addScaledVector(p.vel, dt);
          p.mesh.rotateX(p.angVel.x * dt);
          p.mesh.rotateY(p.angVel.y * dt);
          p.mesh.rotateZ(p.angVel.z * dt);
          const gy = getGroundHeight(p.mesh.position.x, p.mesh.position.z);
          if (p.mesh.position.y <= gy + 0.05) {
            p.mesh.position.y = gy + 0.05;
            p.vel.multiplyScalar(0.3); p.vel.y = Math.abs(p.vel.y) * 0.15;
            p.angVel.multiplyScalar(0.5);
            p.landTimer += dt;
            if (p.landTimer > 0.3) p.landed = true;
          }
        }
      });
      if (r.t > 5) {
        const k = Math.min(1, (r.t - 5) / 1.2);
        r.pieces.forEach(p => { p.mesh.traverse(o => { if (o.material) o.material.opacity = 1 - k; }); });
        if (k >= 1) {
          // 注意：碎片使用的是角色共享几何体缓存，绝不能在这里 dispose 几何体（会破坏所有角色的渲染）；
          // 材质是布娃娃产生时逐个 clone 出来的独立实例，可以安全释放
          r.pieces.forEach(p => { scene.remove(p.mesh); p.mesh.traverse(o => { if (o.material) o.material.dispose(); }); });
          ragdolls.splice(i, 1);
        }
      }
    }
  }
