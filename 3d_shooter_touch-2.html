  function createVehicleMesh(type) {
    if (type === 'tank') return createTankMesh();
    if (type === 'jet') return createJetMesh();
    if (type === 'speedboat') return createSpeedboatMesh();
    return createJeepMesh();
  }

  const vehicles = [];
  function spawnVehicleAt(x, z, type) {
    const cfg = vehicleTypes[type];
    const mesh = createVehicleMesh(type);
    const groundY = getGroundHeight(x, z);
    // 战斗机停在起落架上（机身不贴地），并再抬高一点，方便滑跑起飞
    const y = cfg.flying ? groundY + JET_GEAR_H + 0.6 : groundY;
    mesh.position.set(x, y, z);
    scene.add(mesh);
    const v = { 
      mesh, type, cfg, 
      yaw: Math.random() * Math.PI * 2, pitch: 0, 
      speed: 0, // 所有载具初始速度为0
      hp: cfg.maxHp, maxHp: cfg.maxHp, 
      occupant: null, 
      fireCooldown: 1, gunner: null, gunnerFireCooldown: 1, 
      passengers: [],
      isAirborne: false, // 战斗机是否已离地
      liftoffGrace: 0,   // 起飞后的落地判定保护期
      jetAmmo: 100,      // 机枪弹链剩余弹数
      jetReload: 0       // 换弹计时
    };
    mesh.userData.hullMesh.userData.vehicleRef = v;
    vehicles.push(v);
  }
  // 注：初始载具的生成延后到 startGame() 中，位置会按所选地图动态选取

  // 快艇专用移动：复用地面载具的物理，额外限制不能越过靠岸线开上陆地
  function moveSpeedboat(v, throttle, steer, dt) {
    moveVehicleGround(v, throttle, steer, dt);
    if (mapType === 'normandy' && v.mesh.position.z > NORMANDY_BOAT_DOCK_Z) {
      v.mesh.position.z = NORMANDY_BOAT_DOCK_Z;
      v.speed = 0;
    }
  }

  let isDriving = false;
  let normandyBoats = []; // 诺曼底地图的快艇列表，供自动摆渡逻辑使用
  let currentVehicle = null;
  let playerSeat = null; // 'driver' | 'gunner'
  let vehicleCamOffset = vehicleTypes.jeep.camOffset;
  const vehicleBtn = document.getElementById('vehicleBtn');

  function findNearbyVehicle() {
    let best = null, bestDist = Infinity, bestSeat = 'driver';
    for (const v of vehicles) {
      const d = Math.hypot(v.mesh.position.x - yawObject.position.x, v.mesh.position.z - yawObject.position.z);
      if (d >= v.cfg.enterRange || d >= bestDist) continue;
      if (!v.occupant) { best = v; bestDist = d; bestSeat = 'driver'; }
      else if (v.type === 'tank' && !v.gunner) { best = v; bestDist = d; bestSeat = 'gunner'; }
      else if (v.cfg.maxPassengers && v.passengers.length < v.cfg.maxPassengers) { best = v; bestDist = d; bestSeat = 'passenger'; }
    }
    return best ? { v: best, seat: bestSeat } : null;
  }

  function setTouchUIVisible(visible) {
    const disp = visible ? '' : 'none';
    fireBtn.style.display = disp;
    jumpBtn.style.display = disp;
    aimBtn.style.display = disp;
    reloadBtn.style.display = disp;
    weaponBtn.style.display = disp;
  }

  function enterVehicle(v, seat) {
    isDriving = true;
    currentVehicle = v;
    playerSeat = seat || 'driver';
    if (playerSeat === 'driver') v.occupant = { list: 'player', ref: null };
    else if (playerSeat === 'gunner') v.gunner = 'player';
    else v.passengers.push('player');
    vehicleCamOffset = (playerSeat === 'gunner' && v.cfg.camOffsetGunner) ? v.cfg.camOffsetGunner : v.cfg.camOffset;
    gunGroup.visible = false;
    playerMesh.visible = false;
    if (inputMode !== 'desktop') {
      setTouchUIVisible(false);
      if ((playerSeat === 'driver' && v.cfg.canFire) || playerSeat === 'gunner') fireBtn.style.display = '';
    }
    vehicleBtn.style.display = 'block';
    vehicleBtn.textContent = '下车';
  }
  function exitVehicle() {
    isDriving = false;
    const v = currentVehicle;
    if (playerSeat === 'gunner') v.gunner = null;
    else if (playerSeat === 'passenger') { const idx = v.passengers.indexOf('player'); if (idx >= 0) v.passengers.splice(idx, 1); }
    else v.occupant = null;
    // 快艇靠岸后玩家下船：把还留在船上的 AI 乘员也一起放下岸，避免卡在船里出不来
    if (v.type === 'speedboat' && !v.occupant) {
      if (v.passengers.length) { v.passengers.forEach(p => disembarkPassenger(p, v)); v.passengers = []; }
    }
    const side = new THREE.Vector3(Math.cos(v.yaw), 0, -Math.sin(v.yaw));
    yawObject.position.x = v.mesh.position.x + side.x * 2;
    yawObject.position.z = v.mesh.position.z + side.z * 2;
    yawObject.position.y = getGroundHeight(yawObject.position.x, yawObject.position.z) + playerHeight;
    currentVehicle = null;
    playerSeat = null;
    if (inputMode !== 'desktop') setTouchUIVisible(true);
    gunGroup.visible = true;
    playerMesh.visible = false;
    vehicleBtn.textContent = '上车';
    vehicleBtn.style.display = 'none';
  }
  vehicleBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (isDriving) { exitVehicle(); }
    else { const found = findNearbyVehicle(); if (found) enterVehicle(found.v, found.seat); }
  }, { passive: false });
  function toggleVehicleInteract() {
    if (isDriving) { exitVehicle(); }
    else { const found = findNearbyVehicle(); if (found) enterVehicle(found.v, found.seat); }
  }

  // 载具撞击步行中的角色：坦克直接撞死，吉普车/汽车造成 30%~50% 最大生命值伤害
  function checkVehicleCharacterCollisions(v, dt) {
    if (v.type === 'jet') return;
    if (Math.abs(v.speed) < 1.5) return; // 低速/静止时不触发碰撞伤害
    const hitRadius = v.cfg.collideR + 0.55;
    const isTank = v.type === 'tank';

    if (player.alive && !isDriving && !player.invulnerable) {
      if (player.runOverCooldown > 0) { player.runOverCooldown -= dt; }
      else {
        const dx = yawObject.position.x - v.mesh.position.x, dz = yawObject.position.z - v.mesh.position.z;
        if (dx * dx + dz * dz < hitRadius * hitRadius) {
          player.runOverCooldown = 1.2;
          if (isTank) { player.hp = 0; flashHit(); updateHud(); gameOver(); }
          else { damageEntity('player', null, player.maxHp * (0.3 + Math.random() * 0.2)); }
        }
      }
    }

    function tryHitList(list, killFn) {
      list.forEach(ent => {
        if (!ent.alive || ent.inVehicle) return;
        if (ent.runOverCooldown > 0) { ent.runOverCooldown -= dt; return; }
        const dx = ent.mesh.position.x - v.mesh.position.x, dz = ent.mesh.position.z - v.mesh.position.z;
        if (dx * dx + dz * dz < hitRadius * hitRadius) {
          ent.runOverCooldown = 1.2;
          const dir = new THREE.Vector3(dx, 0, dz).normalize();
          if (isTank) {
            ent.hp = 0;
            killFn(ent, dir);
          } else {
            ent.hp -= (ent.maxHp || 100) * (0.3 + Math.random() * 0.2);
            if (ent.hp <= 0) killFn(ent, dir);
            else { flashEnemyHit(ent, false); knockbackEnemy(ent, dir); }
          }
        }
      });
    }
    tryHitList(enemies, killEnemy);
    tryHitList(friendlies, killFriendly);
  }

  function moveVehicleGround(v, throttle, steer, dt) {
    const cfg = v.cfg;
    v.speed += throttle * dt * cfg.accel;
    // 柏林沼泽：坦克靠履带只减速 20%，轮式/其它载具陷在泥里减速 60%
    const swampMul = inBerlinSwamp(v.mesh.position.x, v.mesh.position.z)
      ? (v.type === 'tank' ? 0.8 : 0.4) : 1;
    v.speed = Math.max(-cfg.speedMax * 0.4 * swampMul, Math.min(cfg.speedMax * swampMul, v.speed));
    v.speed *= (1 - dt * 0.6);
    v.yaw -= steer * dt * cfg.turnRate * Math.min(1, Math.abs(v.speed) / 4 + 0.3);
    const dir = new THREE.Vector3(-Math.sin(v.yaw), 0, -Math.cos(v.yaw));
    const nx = v.mesh.position.x + dir.x * v.speed * dt;
    const nz = v.mesh.position.z + dir.z * v.speed * dt;
    if (!collidesAt(nx, v.mesh.position.z, cfg.collideR)) v.mesh.position.x = nx; else v.speed *= 0.3;
    if (!collidesAt(v.mesh.position.x, nz, cfg.collideR)) v.mesh.position.z = nz; else v.speed *= 0.3;
    v.mesh.position.y = getGroundHeight(v.mesh.position.x, v.mesh.position.z) + 0.05;
    v.mesh.rotation.set(0, v.yaw, 0);
    if (v.mesh.userData.wheels) v.mesh.userData.wheels.forEach(w => { w.rotation.x += v.speed * dt * 2; });
    checkVehicleCharacterCollisions(v, dt);
  }
  function moveVehicleAir(v, throttle, steer, dt) {
    const cfg = v.cfg;
    const groundY = getGroundHeight(v.mesh.position.x, v.mesh.position.z);
    const altitudeAboveGround = v.mesh.position.y - groundY;

    if (!v.isAirborne) {
      // ========== 地面滑跑阶段 ==========
      // 油门控制：W 加速，S 制动，松开时保持速度
      if (throttle > 0.2) {
        // W 按下（throttle > 0）：快速加速
        v.speed += dt * cfg.accel * 1.3;
      } else if (throttle < -0.2) {
        // S 按下（throttle < 0）：制动减速
        v.speed -= dt * cfg.accel * 0.7;
      }
      // 松开两个键：速度保持（关键改进！）
      
      v.speed = Math.max(0, Math.min(cfg.speedMax, v.speed));

      // 有速度时才能转向
      if (v.speed > 0.5) {
        v.yaw -= steer * dt * cfg.turnRate * 0.4; // 地面转向较慢
      }

      // 沿着机头方向滑跑（水平移动）
      const forward = new THREE.Vector3(-Math.sin(v.yaw), 0, -Math.cos(v.yaw));
      v.mesh.position.addScaledVector(forward, v.speed * dt);

      // 起飞条件：速度足够快（>= 12）或者拉起机头（pitchInput < -0.6）
      // 大幅降低起飞速度阈值，从 17 -> 12
      // 起飞：给一个初始离地高度和抬头角，否则空中分支开头算出的高度仍是 0，
      // 会立刻被下面的落地判定打回并把速度清零（这就是"加速到一定速度就停住"的原因）
      const takeoffSpeed = 10;
      if (v.speed >= takeoffSpeed && v.pitch > 0.15) {
        v.isAirborne = true;
        v.mesh.position.y = groundY + JET_GEAR_H + 2.5;
        v.pitch = Math.max(v.pitch, 0.2);
        v.liftoffGrace = 0.6; // 起飞后 0.6 秒内不做落地判定
      }
      // 注意：地面滑跑时俯仰现在由鼠标/右摇杆直接控制，不再在这里计算
    } else {
      // ========== 空中飞行阶段：俯仰由鼠标/右摇杆控制，机头方向 = 飞行方向 ==========
      // 油门由左摇杆前后（throttle）控制速度
      v.speed += throttle * dt * cfg.accel * 0.8;
      v.speed = Math.max(10, Math.min(cfg.speedMax * 1.25, v.speed));

      // 转向（左右摇杆）
      v.yaw -= steer * dt * cfg.turnRate;

      // v.pitch 直接由鼠标控制，不需要在这里计算目标值
      v.pitch = Math.max(-0.6, Math.min(0.6, v.pitch));

      // 机头方向 = 飞行方向
      const dir = new THREE.Vector3(
        -Math.sin(v.yaw) * Math.cos(v.pitch),
        Math.sin(v.pitch),
        -Math.cos(v.yaw) * Math.cos(v.pitch)
      );
      v.mesh.position.addScaledVector(dir, v.speed * dt);

      // 落地判定必须用移动之后的实时高度（函数开头那个是移动前的旧值），
      // 并且给刚起飞的一小段保护期，否则起飞当帧就会被判定成着陆
      if (v.liftoffGrace > 0) v.liftoffGrace -= dt;
      const newGroundY = getGroundHeight(v.mesh.position.x, v.mesh.position.z);
      const altNow = v.mesh.position.y - newGroundY;
      if (v.liftoffGrace <= 0 && altNow < JET_GEAR_H + 0.5) {
        v.isAirborne = false;
        v.mesh.position.y = newGroundY + JET_GEAR_H;
        v.speed = Math.min(v.speed, 8); // 着陆后保留一点滑行速度，方便再次起飞
        v.pitch = 0;
      }
    }

    // 地面滑跑时贴合地形，机身抬到起落架高度上，避免地势起伏把飞机埋进地下或误判坠毁
    if (!v.isAirborne) {
      v.mesh.position.y = getGroundHeight(v.mesh.position.x, v.mesh.position.z) + JET_GEAR_H;
    }

    v.mesh.rotation.set(v.pitch, v.yaw, -steer * 0.2);
  }

  function updateDriving(dt) {
    const v = currentVehicle;
    if (!v) return;
    if (v.fireCooldown > 0) v.fireCooldown -= dt;
    if (v.gunnerFireCooldown > 0) v.gunnerFireCooldown -= dt;
    if (v.jetReload > 0) v.jetReload -= dt;

    // 驾驶载具时按住开火键要能持续射击。
    // 原本的自动连发只写在步行分支里，导致车/机上按住开火只会响一发 ——
    // 战斗机机枪因此变成"一按一响"，感觉就像打炮。
    // 只有速射武器（战斗机机枪、车顶机枪）自动连发，坦克主炮仍然点一次打一发。
    const autoFireSeat = (playerSeat === 'gunner') || (playerSeat === 'driver' && v.type === 'jet');
    if (firing && autoFireSeat) vehicleTryShoot();

    if (playerSeat === 'driver') {
      const throttle = -moveVec.y; // 油门只来自左摇杆前后
      let steer = moveVec.x; // 默认左摇杆左右转向（步行/坦克）
      
      if (v.cfg.flying) {
        // 战斗机：左摇杆只管油门，转向和俯仰全部由右摇杆控制
        steer = lookVec.x; // 右摇杆水平 = 转向
        moveVehicleAir(v, throttle, steer, dt);
        // 右摇杆竖直改变飞机俯仰
        if (Math.abs(lookVec.y) > 0.1) {
          v.pitch = Math.max(-0.6, Math.min(0.6, v.pitch + lookVec.y * dt * 1.5));
        }
      }
      else if (v.type === 'speedboat') moveSpeedboat(v, throttle, steer, dt);
      else moveVehicleGround(v, throttle, steer, dt);
      if (!currentVehicle) return;
    }

    if (playerSeat === 'driver' && !v.cfg.flying) {
      // 非飞行载具：摄像机始终在载具中心上方
      yawObject.position.x = v.mesh.position.x;
      yawObject.position.z = v.mesh.position.z;
      yawObject.position.y = v.mesh.position.y + 1.5;
    }
    // 战斗机的摄像机由下面的 jet 分支专门处理（包括 x/y/z 和 rotation），不需要这里同步
    if (!v.cfg.flying && playerSeat !== 'driver') {
      yawObject.position.y = v.mesh.position.y + 0.6 + (playerSeat === 'gunner' ? 0.5 : 0);
    }

    if (v.type === 'tank') {
      // 坦克驾驶位：炮塔可独立瞄准，相机不再强制锁定车体朝向，而是自由环视，炮塔随视线转向/俯仰
      // 机枪位：同样自由环视，但不控制炮塔/车体，只操作车顶机枪
      if (playerSeat === 'driver') {
        camera.getWorldDirection(camWorldDir);
        aimTankTurret(v, camWorldDir);
      } else if (playerSeat === 'gunner' && v.mesh.userData.gunnerMount) {
        // 机枪支座跟随机枪手视线转动（不影响炮塔），让曳光弹和机枪模型朝向一致
        camera.getWorldDirection(camWorldDir);
        const mount = v.mesh.userData.gunnerMount;
        mount.rotation.order = 'YXZ';
        const flatLen = Math.hypot(camWorldDir.x, camWorldDir.z) || 0.0001;
        let mountYaw = Math.atan2(-camWorldDir.x, -camWorldDir.z) - v.yaw;
        while (mountYaw > Math.PI) mountYaw -= Math.PI * 2;
        while (mountYaw < -Math.PI) mountYaw += Math.PI * 2;
        mount.rotation.y = mountYaw;
        mount.rotation.x = Math.max(-0.5, Math.min(0.6, Math.atan2(camWorldDir.y, flatLen)));
      }
    } else if (v.type === 'jet') {
      // ========== 战斗机：摄像机固定在机身后方，射击方向用机头向量 ==========
      // 摄像机位置：机身后方、向上，始终看向机身（追尾视角）
      const jetHeadingDir = new THREE.Vector3(
        -Math.sin(v.yaw) * Math.cos(v.pitch),
        Math.sin(v.pitch),
        -Math.cos(v.yaw) * Math.cos(v.pitch)
      ).normalize();
      const backDir = jetHeadingDir.clone().negate(); // 机尾方向
      const upDir = new THREE.Vector3(0, 1, 0);
      
      // 摄像机距离机身尾部约 10 单位，向上抬 3 单位（俯视视角）
      yawObject.position.copy(v.mesh.position)
        .addScaledVector(backDir, 10)
        .addScaledVector(upDir, 3);
      
      // 摄像机始终看向飞机（自动计算俯角和偏航）
      // 用向量差计算方向，让摄像机永远瞄着机身中心
      const lookDir = new THREE.Vector3().subVectors(v.mesh.position, yawObject.position).normalize();
      yawObject.rotation.y = Math.atan2(-lookDir.x, -lookDir.z);
      const flatLen = Math.hypot(lookDir.x, lookDir.z) || 0.0001;
      pitchObject.rotation.x = Math.atan2(lookDir.y, flatLen);
      
      // 摄像机相对于 yawObject 的本地位置始终指向前方（自动内置在 yawObject.position/rotation 中）
    } else {
      // 其他载具（不是坦克不是战斗机）：摄像机以第一人称跟随
      yawObject.rotation.y = v.yaw;
      pitchObject.rotation.x *= 0.9;
    }
  }

  // AI 驾驶（敌我双方 NPC 均可上载具作战）
  function updateVehicleAuto(v, dt) {
    const isEnemyDriven = v.occupant.list === 'enemy';
    let target = isEnemyDriven
      ? { pos: yawObject.position, kind: 'player' }
      : null;
    let bestDist = isEnemyDriven ? Math.hypot(yawObject.position.x - v.mesh.position.x, yawObject.position.z - v.mesh.position.z) : Infinity;
    const scanList = isEnemyDriven ? friendlies : enemies;
    scanList.forEach(f => {
      if (!f.alive) return;
      const d = Math.hypot(f.mesh.position.x - v.mesh.position.x, f.mesh.position.z - v.mesh.position.z);
      if (d < bestDist) { bestDist = d; target = { pos: f.mesh.position, kind: isEnemyDriven ? 'friendly' : 'enemy', ref: f }; }
    });
    if (!target) { v.speed *= (1 - dt * 0.5); return; }

    const dx = target.pos.x - v.mesh.position.x, dz = target.pos.z - v.mesh.position.z;
    const desiredYaw = Math.atan2(-dx, -dz);
    let yawDiff = desiredYaw - v.yaw;
    while (yawDiff > Math.PI) yawDiff -= Math.PI * 2;
    while (yawDiff < -Math.PI) yawDiff += Math.PI * 2;
    const steer = Math.max(-1, Math.min(1, -yawDiff * 1.2));
    const preferredDist = v.cfg.flying ? 20 : 16;
    const throttle = bestDist > preferredDist ? 1 : (bestDist < preferredDist * 0.5 ? -0.4 : 0.2);

    if (v.cfg.flying) moveVehicleAir(v, -throttle, steer, dt);
    else moveVehicleGround(v, throttle, steer, dt);
    if (v.hp <= 0) return; // 可能已在上面坠毁

    if (v.type === 'tank') {
      const aimDir3 = new THREE.Vector3(dx, (target.pos.y + 1.0) - (v.mesh.position.y + 1.55), dz);
      aimTankTurret(v, aimDir3);
    }

    v.fireCooldown -= dt;
    const engageRange = v.type === 'tank' ? 42 : 32;
    if (v.fireCooldown <= 0 && bestDist < engageRange) {
      const firePos = v.mesh.position.clone(); firePos.y += 1.2;
      const aimAt = new THREE.Vector3(target.pos.x, target.pos.y, target.pos.z);
      if (hasLineOfSight(firePos, aimAt)) {
      if (v.type === 'tank') {
        v.fireCooldown = v.cfg.fireRate + Math.random() * 1.0;
        const barrelDir = getBarrelForward(v);
        const jitter = 0.02 + bestDist * 0.0025;
        const jitteredDir = barrelDir.clone().add(new THREE.Vector3(
          (Math.random() - 0.5) * jitter, (Math.random() - 0.5) * jitter * 0.5, (Math.random() - 0.5) * jitter
        )).normalize();
        launchTankShell(v, jitteredDir);
      } else if (v.type === 'jet') {
        // AI 战斗机：机枪扫射
        v.fireCooldown = v.cfg.fireRate + Math.random() * 0.5;
        const jetHeadingDir = new THREE.Vector3(
          -Math.sin(v.yaw) * Math.cos(v.pitch),
          Math.sin(v.pitch),
          -Math.cos(v.yaw) * Math.cos(v.pitch)
        ).normalize();
        const muzzlePos = v.mesh.position.clone().addScaledVector(jetHeadingDir, 3.5);
        
        // AI 也是每次一发，靠高射速形成弹流（一次打一大把射线会明显拖慢帧率）
        const spreadDir = jetHeadingDir.clone().add(new THREE.Vector3(
          (Math.random() - 0.5) * 0.05,
          (Math.random() - 0.5) * 0.03,
          (Math.random() - 0.5) * 0.05
        )).normalize();

        const hitChance = Math.max(0.15, Math.min(0.5, 0.5 - bestDist * 0.008));
        if (Math.random() < hitChance) {
          const dmg = v.cfg.gunDamage * (0.5 + Math.random() * 0.5);
          if (target.kind === 'player') damageEntity('player', null, dmg);
          else damageEntity(target.kind, target.ref, dmg, new THREE.Vector3(dx, 0, dz).normalize());
        }
        const targetPoint = muzzlePos.clone().addScaledVector(spreadDir, 200);
        spawnBullet(muzzlePos, targetPoint, isEnemyDriven ? 0xff5533 : 0x66ff99, v.cfg.bulletSpeed);
      } else {
      v.fireCooldown = 1.6 + Math.random() * 1.2;
      const hitChance = Math.max(0.25, Math.min(0.75, 0.75 - bestDist * 0.012));
      const isHit = Math.random() < hitChance;
      const pt = isHit ? aimAt.clone().add(new THREE.Vector3((Math.random() - 0.5) * 0.4, (Math.random() - 0.5) * 0.4, (Math.random() - 0.5) * 0.4))
                        : aimAt.clone().add(new THREE.Vector3((Math.random() - 0.5) * 4, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 4));
      spawnBullet(firePos, pt, isEnemyDriven ? 0xff5533 : 0x66ff99, 90);
      if (isHit) {
        const dmg = v.cfg.gunDamage * (0.6 + Math.random() * 0.5);
        if (target.kind === 'player') damageEntity('player', null, dmg);
        else damageEntity(target.kind, target.ref, dmg, new THREE.Vector3(dx, 0, dz).normalize());
      }
      }
      }
    }
  }

  function explodeVehicle(v) {
    const wasCurrentPlayerVehicle = (v.occupant && v.occupant.list === 'player') || (v.gunner === 'player') || (v.passengers && v.passengers.includes('player'));
    spawnExplosion(v.mesh.position.clone(), 6.5);
    scene.remove(v.mesh);
    const idx = vehicles.indexOf(v);
    if (idx >= 0) vehicles.splice(idx, 1);
    if (normandyBoats.includes(v)) { const bi = normandyBoats.indexOf(v); if (bi >= 0) normandyBoats.splice(bi, 1); }

    enemies.forEach(en => {
      if (!en.alive) return;
      const d = v.mesh.position.distanceTo(en.mesh.position);
      if (d < 6.5) { const dmg = 80 * (1 - d / 6.5); if (en.hp - dmg <= 0) killEnemy(en, new THREE.Vector3(Math.random() - 0.5, 0.6, Math.random() - 0.5).normalize()); else { en.hp -= dmg; flashEnemyHit(en, false); } }
    });
    friendlies.forEach(f => {
      if (!f.alive) return;
      const d = v.mesh.position.distanceTo(f.mesh.position);
      if (d < 6.5) { const dmg = 80 * (1 - d / 6.5); if (f.hp - dmg <= 0) killFriendly(f, new THREE.Vector3(Math.random() - 0.5, 0.6, Math.random() - 0.5).normalize()); else { f.hp -= dmg; flashEnemyHit(f, false); } }
    });
    const distToPlayer = v.mesh.position.distanceTo(yawObject.position);
    if (distToPlayer < 6.5 && !wasCurrentPlayerVehicle && !player.invulnerable) {
      const dmg = 55 * (1 - distToPlayer / 6.5);
      player.hp -= dmg; player.regenDelay = REGEN_DELAY_AFTER_HIT; flashHit(); shakeMag = Math.min(0.4, shakeMag + 0.2);
      if (player.hp <= 0) { player.hp = 0; gameOver(); }
      updateHud();
    }

    if (v.occupant && v.occupant.list === 'enemy') killEnemy(v.occupant.ref, new THREE.Vector3(0, 1, 0));
    else if (v.occupant && v.occupant.list === 'friendly') killFriendly(v.occupant.ref, new THREE.Vector3(0, 1, 0));
    if (v.gunner && v.gunner.list === 'enemy') killEnemy(v.gunner.ref, new THREE.Vector3(0, 1, 0));
    else if (v.gunner && v.gunner.list === 'friendly') killFriendly(v.gunner.ref, new THREE.Vector3(0, 1, 0));
    if (v.passengers) {
      v.passengers.forEach(p => {
        if (p && p.list === 'enemy') killEnemy(p.ref, new THREE.Vector3(0, 1, 0));
        else if (p && p.list === 'friendly') killFriendly(p.ref, new THREE.Vector3(0, 1, 0));
      });
    }

    if (wasCurrentPlayerVehicle) {
      isDriving = false; currentVehicle = null;
      yawObject.position.y = getGroundHeight(yawObject.position.x, yawObject.position.z) + playerHeight;
      if (inputMode !== 'desktop') setTouchUIVisible(true);
      gunGroup.visible = true;
      playerMesh.visible = false;
      vehicleBtn.textContent = '上车'; vehicleBtn.style.display = 'none';
      player.hp -= 25; flashHit(); shakeMag = Math.min(0.4, shakeMag + 0.25);
      if (player.hp <= 0) { player.hp = 0; updateHud(); gameOver(); } else { updateHud(); }
    }

    // 载具损毁立即刷新：所有载具（敌方或友方）摧毁后都会在对应势力的据点附近立即生成替代车辆
    if (v.occupant && v.type !== 'speedboat') {
      if (v.occupant.list === 'enemy') {
        // 敌方载具：在敌方据点附近刷新
        const ownedRed = getOwnedControlPoints('red');
        if (ownedRed.length > 0) {
          const cp = ownedRed[Math.floor(Math.random() * ownedRed.length)];
          const offset = (Math.random() - 0.5) * 25;
          spawnVehicleAt(cp.x + offset, cp.z + 8 + (Math.random() - 0.5) * 10, v.type);
        }
      } else if (v.occupant.list === 'friendly') {
        // 友方载具：在己方据点附近刷新
        const ownedBlue = getOwnedControlPoints('blue');
        if (ownedBlue.length > 0) {
          const cp = ownedBlue[Math.floor(Math.random() * ownedBlue.length)];
          const offset = (Math.random() - 0.5) * 25;
          spawnVehicleAt(cp.x + offset, cp.z + 8 + (Math.random() - 0.5) * 10, v.type);
        }
      }
    }
  }

  // =========================================================
  // 诺曼底快艇摆渡系统：AI 优先登船 -> 坐满/等待超时后由驾驶员开往岸边 -> 靠岸卸载 -> 返航接下一批
  // 与坦克/吉普那套"追击战斗"AI 完全分开，走独立的状态机（loading -> toShore -> unloading -> returning）
  // =========================================================
  const NORMANDY_BOAT_MAX_WAIT = 6; // 装载等待时间上限（秒）：超时且船上至少有1人也会出发，避免卡死不发船

  // 把某个乘员（玩家或 NPC）放下船，恢复其自由行动/AI，安置在船体旁边的位置上
  function disembarkPassenger(p, v) {
    if (!p) return;
    if (p === 'player') {
      if (currentVehicle === v) exitVehicle();
      return;
    }
    const ref = p.ref;
    if (!ref || !ref.alive) return;
    ref.inVehicle = false;
    ref.vehicle = null;
    ref.mesh.visible = true;
    const ang = Math.random() * Math.PI * 2;
    ref.mesh.position.set(v.mesh.position.x + Math.cos(ang) * 2, getGroundHeight(v.mesh.position.x, v.mesh.position.z), v.mesh.position.z + Math.sin(ang) * 2);
  }

  // 让最近的、还没登船/不在载具里的友军直接"登船"（免走位直接分配座位），体现"AI优先登上快艇"
  function boardNearestFriendlyToBoat(v, seat) {
    let best = null, bestDist = Infinity;
    friendlies.forEach(f => {
      if (!f.alive || f.inVehicle) return;
      const d = Math.hypot(f.mesh.position.x - v.mesh.position.x, f.mesh.position.z - v.mesh.position.z);
      if (d < 16 && d < bestDist) { bestDist = d; best = f; }
    });
    if (!best) return false;
    best.inVehicle = true;
    best.vehicle = v;
    best.mesh.visible = false;
    if (seat === 'driver') v.occupant = { list: 'friendly', ref: best };
    else v.passengers.push({ list: 'friendly', ref: best });
    return true;
  }

  function updateNormandyFerry(dt) {
    normandyBoats.forEach(v => updateOneNormandyFerry(v, dt));
  }
  function updateOneNormandyFerry(v, dt) {
    if (!v || v.hp <= 0) return;
    const seatsTotal = 1 + v.cfg.maxPassengers;
    v.ferryState = v.ferryState || 'loading';
    v.ferryTimer = v.ferryTimer || 0;
    const homeX = v.homeX || 0, dockX = v.dockX || 0;

    if (v.ferryState === 'loading') {
      // 玩家自己在开船时，摆渡状态机不再抢座位/不自动出发，完全交给玩家手动操作
      if (v.occupant && v.occupant.list === 'player') return;
      v.ferryTimer += dt;
      if (!v.occupant) boardNearestFriendlyToBoat(v, 'driver');
      while (v.passengers.length < v.cfg.maxPassengers && boardNearestFriendlyToBoat(v, 'passenger')) {}
      const count = (v.occupant ? 1 : 0) + v.passengers.length;
      if (count >= seatsTotal || (v.ferryTimer > NORMANDY_BOAT_MAX_WAIT && count > 0)) {
        v.ferryState = 'toShore';
        v.ferryTimer = 0;
      }
      return;
    }

    if (v.occupant && v.occupant.list === 'player') return; // 玩家驾驶时完全手动，不接管转向/靠岸/卸载

    if (v.ferryState === 'toShore' || v.ferryState === 'returning') {
      const targetX = v.ferryState === 'toShore' ? dockX : homeX;
      const targetZ = v.ferryState === 'toShore' ? NORMANDY_BOAT_DOCK_Z : NORMANDY_BOAT_SPAWN_Z;
      const dx = targetX - v.mesh.position.x, dz = targetZ - v.mesh.position.z;
      const dist = Math.hypot(dx, dz);
      const desiredYaw = Math.atan2(-dx, -dz);
      let yawDiff = desiredYaw - v.yaw;
      while (yawDiff > Math.PI) yawDiff -= Math.PI * 2;
      while (yawDiff < -Math.PI) yawDiff += Math.PI * 2;
      const steer = Math.max(-1, Math.min(1, -yawDiff * 1.2));
      const throttle = dist > 3 ? 1 : 0.2;
      moveSpeedboat(v, throttle, steer, dt);
      if (dist < 3) {
        if (v.ferryState === 'toShore') { v.ferryState = 'unloading'; v.ferryTimer = 0; }
        else { v.ferryState = 'loading'; v.ferryTimer = 0; }
      }
      return;
    }

    if (v.ferryState === 'unloading') {
      if (v.occupant) { disembarkPassenger(v.occupant, v); v.occupant = null; }
      if (v.passengers.length) { v.passengers.forEach(p => disembarkPassenger(p, v)); v.passengers = []; }
      v.ferryState = 'returning';
      v.ferryTimer = 0;
    }
  }

  // =========================================================
  // 据点争夺（占领模式）：地图上随机生成 5 个据点，红蓝双方争夺
  // =========================================================
  const CAPTURE_RADIUS = 10;
  const controlPoints = [];
  let controlTimer = 0;

  function createControlPointMesh() {
    const g = new THREE.Group();
    const poleMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 4, 8), poleMat);
    pole.position.y = 2; pole.castShadow = true; g.add(pole);
    const flagMat = new THREE.MeshStandardMaterial({ color: 0x999999, side: THREE.DoubleSide });
    const flag = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.7), flagMat);
    flag.position.set(0.6, 3.5, 0); g.add(flag);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x999999, transparent: true, opacity: 0.35, side: THREE.DoubleSide });
    const ring = new THREE.Mesh(new THREE.RingGeometry(CAPTURE_RADIUS - 0.3, CAPTURE_RADIUS, 32), ringMat);
    ring.rotation.x = -Math.PI / 2; ring.position.y = 0.05; g.add(ring);
    g.userData.flagMat = flagMat;
    g.userData.ringMat = ringMat;
    return g;
  }

  function createControlPoint(x, z, index) {
    const mesh = createControlPointMesh();
    mesh.position.set(x, getGroundHeight(x, z), z);
    scene.add(mesh);
    const cp = { x, z, mesh, control: 0, owner: 'neutral', index };
    controlPoints.push(cp);
    updateControlPointVisual(cp);
    const el = document.createElement('div');
    el.className = 'cpIcon';
    el.innerHTML = '<div class="fill"></div>';
    document.getElementById('controlHud').appendChild(el);
    cp.hudEl = el;
    cp.hudFill = el.querySelector('.fill');
  }

  function updateControlPointVisual(cp) {
    const color = cp.owner === 'blue' ? 0x3a7bd5 : (cp.owner === 'red' ? 0xd5453a : 0xaaaaaa);
    cp.mesh.userData.flagMat.color.set(color);
    cp.mesh.userData.ringMat.color.set(color);
    if (cp.hudFill) {
      cp.hudFill.style.height = Math.round(Math.abs(cp.control)) + '%';
      cp.hudFill.style.background = cp.control >= 0 ? '#3a7bd5' : '#d5453a';
    }
  }

  const NUM_CONTROL_POINTS = 10;
  function generateControlPoints() {
    if (mapType === 'berlin') {
      // 柏林：10个据点全部散布在前段的棕色沼泽山头上，开局全部由敌方据守
      const picked = [];
      for (let i = 0; i < NUM_CONTROL_POINTS; i++) {
        let pt, attempts = 0;
        do {
          pt = {
            x: (Math.random() - 0.5) * BERLIN_HALF_W * 1.7,
            z: BERLIN_SWAMP_FAR_Z + 10 + Math.random() * (BERLIN_SWAMP_NEAR_Z - BERLIN_SWAMP_FAR_Z - 18)
          };
          attempts++;
        } while (attempts < 60 && picked.some(p => Math.hypot(p.x - pt.x, p.z - pt.z) < 18));
        picked.push(pt);
      }
      picked.forEach((p, i) => createControlPoint(p.x, p.z, i));
    } else if (mapType === 'normandy') {
      // 诺曼底：10个据点全部散布在沙滩以内的内陆区域，开局全部由敌方据守
      const picked = [];
      for (let i = 0; i < NUM_CONTROL_POINTS; i++) {
        let pt, attempts = 0;
        do {
          pt = {
            x: (Math.random() - 0.5) * NORMANDY_HALF_W * 1.8,
            z: NORMANDY_LAND_Z + 6 + Math.random() * (NORMANDY_FAR_Z - NORMANDY_LAND_Z - 6)
          };
          attempts++;
        } while (attempts < 60 && picked.some(p => Math.hypot(p.x - pt.x, p.z - pt.z) < 18));
        picked.push(pt);
      }
      picked.forEach((p, i) => createControlPoint(p.x, p.z, i));
    } else if (isBoundedMap()) {
      const picked = [];
      for (let i = 0; i < NUM_CONTROL_POINTS; i++) {
        let pt, attempts = 0;
        do {
          const r = Math.floor(Math.random() * mazeRows), c = Math.floor(Math.random() * mazeCols);
          pt = { x: mazeOrigin.x + c * mazeCellSize + mazeCellSize / 2, z: mazeOrigin.z + r * mazeCellSize + mazeCellSize / 2 };
          attempts++;
        } while (attempts < 60 && picked.some(p => Math.hypot(p.x - pt.x, p.z - pt.z) < mazeCellSize * 4));
        picked.push(pt);
      }
      picked.forEach((p, i) => createControlPoint(p.x, p.z, i));
    } else {
      for (let i = 0; i < NUM_CONTROL_POINTS; i++) {
        const angle = (i / NUM_CONTROL_POINTS) * Math.PI * 2 + Math.random() * 0.3;
        const radius = 48 + Math.random() * 48;
        const x = yawObject.position.x + Math.cos(angle) * radius;
        const z = yawObject.position.z + Math.sin(angle) * radius;
        createControlPoint(x, z, i);
      }
    }

    // 开局据点归属：斯大林格勒地图是"固守"模式——我方仅据守2个据点，敌方占据其余8个据点，
    // 开局即兵力悬殊，目标不是反攻夺取全部据点，而是死守剩下的2个据点撑满时间；
    // 诺曼底地图是"抢滩登陆"模式——10个据点开局全部归敌方，玩家要从零开始一个个攻占；
    // 其它地图维持原有的三三分制（离出生点最近3个归蓝方，最远3个归红方，其余中立）
    if (controlPoints.length === NUM_CONTROL_POINTS) {
      if (mapType === 'normandy' || mapType === 'berlin') {
        controlPoints.forEach(cp => { cp.control = -100; cp.owner = 'red'; updateControlPointVisual(cp); });
      } else {
        controlPoints.forEach(cp => { cp._d = Math.hypot(cp.x - yawObject.position.x, cp.z - yawObject.position.z); });
        const sorted = controlPoints.slice().sort((a, b) => a._d - b._d);
        if (mapType === 'stalingrad') {
          sorted.slice(0, 2).forEach(cp => { cp.control = 100; cp.owner = 'blue'; });
          sorted.slice(2).forEach(cp => { cp.control = -100; cp.owner = 'red'; });
        } else {
          sorted.slice(0, 3).forEach(cp => { cp.control = 100; cp.owner = 'blue'; });
          sorted.slice(-3).forEach(cp => { cp.control = -100; cp.owner = 'red'; });
        }
        controlPoints.forEach(cp => updateControlPointVisual(cp));
      }
    }

    // 斯大林格勒的胜利条件是"坚守10分钟"，不是攻占全部据点：这里显示倒计时 HUD
    if (mapType === 'stalingrad' && holdTimerEl) holdTimerEl.style.display = 'block';
  }

  function getOwnedControlPoints(owner) { return controlPoints.filter(cp => cp.owner === owner); }
  function findNearestCapturablePoint(fromPos, excludeOwner) {
    let best = null, bestD = Infinity;
    controlPoints.forEach(cp => {
      if (cp.owner === excludeOwner) return;
      const d = Math.hypot(cp.x - fromPos.x, cp.z - fromPos.z);
      if (d < bestD) { bestD = d; best = cp; }
    });
    return best;
  }

  // =========================================================
  // 指挥系统：按下指挥按钮，准心对准某个非蓝方据点，征召援军并让全体友军前往集结
  // 解锁条件：我方阵亡达到 50 解锁第 1 次，达到 80 解锁第 2 次
  // =========================================================
  let rallyPoint = null;
  let normandyFinalAssaultTriggered = false; // 诺曼底：敌方只剩1个据点时自动集结，只触发一次
  let rallyUsesConsumed = 0;
  const pendingFriendlySpawns = []; // 援军生成队列：分帧处理，避免一次性生成造成卡顿
  let pendingSpawnTimer = 0;
  function rallyUsesAvailable() {
    if (friendlyDeathCount >= 80) return 2;
    if (friendlyDeathCount >= 50) return 1;
    return 0;
  }
  const rallyMsgEl = document.getElementById('rallyMsg');
  let rallyMsgTimer = null;
  function showRallyMsg(text) {
    rallyMsgEl.textContent = text;
    rallyMsgEl.style.opacity = '1';
    clearTimeout(rallyMsgTimer);
    rallyMsgTimer = setTimeout(() => { rallyMsgEl.style.opacity = '0'; }, 2200);
  }
  function issueRallyCommand() {
    if (!player.alive) return;
    const available = rallyUsesAvailable();
    if (rallyUsesConsumed >= available) {
      if (available === 0) showRallyMsg('集结令未解锁（我方阵亡达到 50 解锁）');
      else showRallyMsg('集结令已用完');
      return;
    }
    camera.getWorldPosition(camWorldPos);
    camera.getWorldDirection(camWorldDir);
    let best = null, bestDot = 0.85; // 视线夹角需在约30度锥形范围内才算瞄准
    controlPoints.forEach(cp => {
      if (cp.owner === 'blue') return;
      const toCp = new THREE.Vector3(cp.x - camWorldPos.x, cp.mesh.position.y + 2 - camWorldPos.y, cp.z - camWorldPos.z).normalize();
      const dot = toCp.dot(camWorldDir);
      if (dot > bestDot) { bestDot = dot; best = cp; }
    });
    if (!best) { showRallyMsg('未瞄准可集结的据点'); return; }

    rallyUsesConsumed++;
    rallyPoint = best;
    if (rallyUsesConsumed >= rallyUsesAvailable()) commandBtn.style.opacity = '0.4';

    // 按距离目标据点的远近，从蓝方据点分级征召援军：最近2个各出5人，其余各出2人
    // 这里只排队，不立即生成——由主循环分帧逐个处理，避免瞬间创建大量角色导致卡顿
    const blueOwned = getOwnedControlPoints('blue').slice().sort((a, b) =>
      Math.hypot(a.x - best.x, a.z - best.z) - Math.hypot(b.x - best.x, b.z - best.z)
    );
    let queuedCount = 0;
    blueOwned.forEach((cp, idx) => {
      const count = idx < 2 ? 5 : 2;
      for (let i = 0; i < count; i++) { pendingFriendlySpawns.push({ cp, rallying: true }); queuedCount++; }
    });

    // 战场上已有的友军也一并转入集结状态，边走边打地赶往据点
    let existingCount = 0;
    friendlies.forEach(f => { if (f.alive && !f.inVehicle) { f.rallying = true; existingCount++; } });

    showRallyMsg('集结令下达！征召 ' + queuedCount + ' 名援军（陆续抵达），已有 ' + existingCount + ' 人同步赶赴据点');
  }
  const commandBtn = document.getElementById('commandBtn');
  commandBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    commandBtn.classList.add('active');
    issueRallyCommand();
    setTimeout(() => commandBtn.classList.remove('active'), 200);
  }, { passive: false });

  // 统计某个据点附近已经有多少个同阵营单位，避免所有兵力扎堆到同一个点
  function countNearbyAt(cp, list) {
    let n = 0;
    list.forEach(e => {
      if (e.alive && !e.inVehicle && Math.hypot(e.mesh.position.x - cp.x, e.mesh.position.z - cp.z) < CAPTURE_RADIUS * 1.5) n++;
    });
    return n;
  }
  // 阵营总人口上限随所占据点数量缩放：据点越少、兵力越弱，避免"仅剩一个据点却仍在原地刷出满编大军"
  function factionCap(owner) {
    const owned = getOwnedControlPoints(owner).length;
    const base = (isBoundedMap() ? 20 : 12) * (owner === 'red' ? 1.2 : 1.0) * (mapType === 'stalingrad' ? 2 : 1);
    let cap = Math.max(3, Math.round(base * owned / NUM_CONTROL_POINTS));
    // 劣势方（占点越少）增援倍率越高，从"落后但还不算太惨"就开始补偿，而不是只在只剩最后一点时才生效
    const deficitBoost = 1 + Math.max(0, 3 - owned) * 0.5; // owned>=3: 1.0x, owned=2: 1.5x, owned=1: 2.0x
    cap = Math.round(cap * deficitBoost);
    return Math.max(3, cap);
  }
  function randomPointNearControlPoint(cp) {
    const maxR = isBoundedMap() ? 2.4 : CAPTURE_RADIUS * 0.8;
    const angle = Math.random() * Math.PI * 2;
    const radius = 1 + Math.random() * maxR;
    return { x: cp.x + Math.cos(angle) * radius, z: cp.z + Math.sin(angle) * radius };
  }

  const captureStatusEl = document.getElementById('captureStatus');
  const holdTimerEl = document.getElementById('holdTimerText');
  const STALINGRAD_HOLD_TARGET = 600; // 斯大林格勒固守模式：坚持 10 分钟（600 秒）即胜利
  let stalingradHoldElapsed = 0;
  function updateControlPoints(dt) {
    // 固守倒计时：只要玩家还活着就持续累计，与据点争夺过程无关；时间一到立即宣布胜利
    if (mapType === 'stalingrad' && player.alive) {
      stalingradHoldElapsed += dt;
      const remain = Math.max(0, STALINGRAD_HOLD_TARGET - stalingradHoldElapsed);
      if (holdTimerEl) {
        const m = Math.floor(remain / 60), s = Math.floor(remain % 60);
        holdTimerEl.textContent = '坚守剩余: ' + m + ':' + (s < 10 ? '0' : '') + s;
      }
      if (stalingradHoldElapsed >= STALINGRAD_HOLD_TARGET) { holdVictory(); return; }
    }
    controlTimer += dt;
    if (controlTimer < 0.3) return;
    controlTimer = 0;

    let playerCapturing = false;
    controlPoints.forEach(cp => {
      let blueCount = 0, redCount = 0;
      const pd = Math.hypot(yawObject.position.x - cp.x, yawObject.position.z - cp.z);
      const playerHere = player.alive && pd < CAPTURE_RADIUS;
      if (playerHere) blueCount++;
      friendlies.forEach(f => {
        if (f.alive && !f.inVehicle && Math.hypot(f.mesh.position.x - cp.x, f.mesh.position.z - cp.z) < CAPTURE_RADIUS) blueCount++;
      });
      enemies.forEach(en => {
        if (en.alive && !en.inVehicle && Math.hypot(en.mesh.position.x - cp.x, en.mesh.position.z - cp.z) < CAPTURE_RADIUS) redCount++;
      });
      vehicles.forEach(v => {
        if (!v.occupant) return;
        if (Math.hypot(v.mesh.position.x - cp.x, v.mesh.position.z - cp.z) >= CAPTURE_RADIUS) return;
        if (v.occupant.list === 'player' || v.occupant.list === 'friendly') blueCount++;
        else if (v.occupant.list === 'enemy') redCount++;
      });

      if (playerHere) playerCapturing = true;

      const rate = 4.5;
      if (blueCount > 0 && redCount === 0) cp.control = Math.min(100, cp.control + rate);
      else if (redCount > 0 && blueCount === 0) cp.control = Math.max(-100, cp.control - rate);
      else if (blueCount > 0 && redCount > 0) {
        const diff = Math.sign(blueCount - redCount);
        cp.control = Math.max(-100, Math.min(100, cp.control + diff * rate * 0.5));
      }
      // 据点归属是持久状态：只有被对方完全拉满(±100)才会真正易主，
      // 争夺过程中依旧算原归属方所有（可以继续在这里刷兵），不会一被人靠近就立刻变中立
      if (cp.control >= 100) cp.owner = 'blue';
      else if (cp.control <= -100) cp.owner = 'red';
      if (rallyPoint === cp && cp.owner === 'blue') rallyPoint = null; // 已拿下，集结指令自动解除
      updateControlPointVisual(cp);
    });

    if (captureStatusEl) captureStatusEl.style.display = playerCapturing ? 'block' : 'none';

    // 诺曼底：敌方只剩最后一个据点时，全军自动转入集结状态，一起压向那最后一处，不用玩家再手动下令
    if ((mapType === 'normandy' || mapType === 'berlin') && !normandyFinalAssaultTriggered) {
      const redLeft = getOwnedControlPoints('red');
      if (redLeft.length === 1) {
        normandyFinalAssaultTriggered = true;
        rallyPoint = redLeft[0];
        let existingCount = 0;
        friendlies.forEach(f => { if (f.alive && !f.inVehicle) { f.rallying = true; existingCount++; } });
        showRallyMsg('敌方仅剩最后1个据点，全军自动集结总攻！(' + existingCount + ' 人赶赴)');
      }
    }

    if (controlPoints.length === NUM_CONTROL_POINTS) {
      if (controlPoints.every(cp => cp.owner === 'blue')) victory();
      else if (mapType !== 'normandy' && mapType !== 'berlin' && controlPoints.every(cp => cp.owner === 'red')) defeat(); // 诺曼底开局本就全部是敌方据点，不适用"全红=战败"判定
    }
  }

  // =========================================================
  // 游戏结束 / 重开
  // =========================================================
  const respawnMsgEl = document.getElementById('respawnMsg');
  let respawnMsgTimer = null;
  function showRespawnMessage() {
    respawnMsgEl.style.opacity = '1';
    clearTimeout(respawnMsgTimer);
    respawnMsgTimer = setTimeout(() => { respawnMsgEl.style.opacity = '0'; }, 1400);
  }

  // 阵亡不再结束游戏，而是在己方（蓝方）占领的据点之一重生
  function gameOver() {
    friendlyDeathCount++;
    if (isDriving && currentVehicle) {
      currentVehicle.occupant = null;
      isDriving = false; currentVehicle = null;
      if (inputMode !== 'desktop') setTouchUIVisible(true);
      gunGroup.visible = true; playerMesh.visible = false;
      vehicleBtn.style.display = 'none'; vehicleBtn.textContent = '上车';
    }

    const owned = getOwnedControlPoints('blue');
    let spawnX = 0, spawnZ = 8;
    if (mapType === 'berlin') {
      // 柏林固定在南侧集结线复活。原逻辑在没有己方据点时会退回写死的 (0, 8)，
      // 而柏林城区的 z 范围是 -78..26，(0,8) 正好落在建筑群正中间；
      // 就算已经占了据点，也不该把玩家直接丢回前线山头，统一从出发线重新推进。
      spawnX = (Math.random() - 0.5) * 30;
      spawnZ = BERLIN_SPAWN_Z + (Math.random() - 0.5) * 8;
    } else if (owned.length > 0) {
      const cp = owned[Math.floor(Math.random() * owned.length)];
      const p = randomPointNearControlPoint(cp);
      spawnX = p.x; spawnZ = p.z;
    }
    yawObject.position.set(spawnX, getGroundHeight(spawnX, spawnZ) + playerHeight, spawnZ);
    yawObject.rotation.y = Math.random() * Math.PI * 2;
    pitchObject.rotation.x = 0;
    player.velocityY = 0;
    player.onGround = true;
    player.hp = player.maxHp;
    player.alive = true;
    player.reloading = false;
    player.weaponsAmmo = weapons.map(w => w.maxAmmo);
    player.invulnerable = true;
    player.invulnTimer = 1.5;
    updateHud();
    showRespawnMessage();
  }
  // =========================================================
  // 胜利过场：摄像机缓缓拉升俯瞰战场 -> 红色"胜利"淡入淡出 -> 战役介绍文字淡入 -> 全屏渐黑 -> 回到地图选择
  // =========================================================
  let victoryCam = null; // {startY, startPitch, targetY, targetPitch, t, duration}
  function updateVictoryCamera(dt) {
    if (!victoryCam) return;
    victoryCam.t = Math.min(victoryCam.duration, victoryCam.t + dt);
    const p = victoryCam.t / victoryCam.duration;
    const ep = 1 - Math.pow(1 - p, 3); // ease-out，先快后慢，停在俯瞰视角
    yawObject.position.y = victoryCam.startY + (victoryCam.targetY - victoryCam.startY) * ep;
    pitchObject.rotation.x = victoryCam.startPitch + (victoryCam.targetPitch - victoryCam.startPitch) * ep;
    yawObject.rotation.y += dt * 0.0225; // 缓慢自转，增加俯瞰全景的电影感
  }

  const victoryTextEl = document.getElementById('victoryText');
  const victoryBlackoutEl = document.getElementById('victoryBlackout');
  const BATTLE_INTRO_TEXT = {
    stalingrad: '1942年至43年，苏德两军在斯大林格勒逐屋逐街血战数月，苏军最终合围德军精锐，成为苏德战场的转折点。',
    normandy: '1944年6月6日，盟军跨越海峡强行登陆诺曼底海滩，向内陆节节推进，开辟欧洲第二战场，加速了战争胜利。',
    berlin: '1945年4月，苏军以两个方面军强渡奥得河，穿过泥泞沼泽与外围高地，逐街攻入柏林城区。4月30日国会大厦上升起红旗，5月2日守军投降，欧洲战场的战火就此熄灭。'
  };
  // 胜利/战败共用的过场演出：摄像机拉升俯瞰 -> 大字标题淡入淡出 -> 结语文字淡入 -> 全屏渐黑 -> 回地图选择
  function playEndSequence(title, subText) {
    // 隐藏原有的据点争夺HUD/触屏操作界面，只保留过场专属的元素
    document.getElementById('hud').style.display = 'none';
    isDriving = false;

    victoryCam = {
      startY: yawObject.position.y,
      startPitch: pitchObject.rotation.x,
      targetY: yawObject.position.y + 75,
      targetPitch: -1.2,
      t: 0,
      duration: 9.0 // 拉升速度放慢一倍（原 4.5 秒）
    };

    // 阶段一：红色大字标题淡入，停留1秒后淡出
    victoryTextEl.classList.remove('sub-style');
    victoryTextEl.textContent = title;
    requestAnimationFrame(() => { victoryTextEl.style.opacity = '1'; });
    setTimeout(() => { victoryTextEl.style.opacity = '0'; }, 1600); // 0.8s淡入 + 停留后开始淡出

    // 阶段二：结语文字淡入，停留5秒后开始全屏渐黑
    setTimeout(() => {
      victoryTextEl.classList.add('sub-style');
      victoryTextEl.textContent = subText;
      requestAnimationFrame(() => { victoryTextEl.style.opacity = '1'; });
    }, 2400);

    // 阶段三：全屏渐黑，之后回到地图选择界面（此时画面已全黑，刷新过渡无感）
    setTimeout(() => {
      victoryBlackoutEl.style.opacity = '1';
    }, 2400 + 5000);
    setTimeout(() => {
      location.reload();
    }, 2400 + 5000 + 1600);
  }

  function victory() {
    if (!player.alive) return;
    player.alive = false;
    playEndSequence('胜利', BATTLE_INTRO_TEXT[mapType] || '干的漂亮，达瓦里氏。');
  }
  // 斯大林格勒固守模式专用胜利：不需要占领全部据点，只要以2个据点撑满10分钟不被敌方8个据点的兵力淹没即算获胜
  function holdVictory() {
    if (!player.alive) return;
    player.alive = false;
    playEndSequence('胜利', BATTLE_INTRO_TEXT[mapType] || '干的漂亮，达瓦里氏。');
  }
  function defeat() {
    if (!player.alive) return;
    player.alive = false;
    playEndSequence('失败', '革命尚未成功，同志仍需努力。');
  }

  // =========================================================
  // 键盘鼠标控制（桌面端）：检测到键鼠输入后自动隐藏全部触屏按钮
  // =========================================================
  let inputMode = 'touch';
  const keys = {};
  const mouseSensitivity = 0.0022;
  canvas.tabIndex = 0;
  canvas.style.outline = 'none';

  function enterDesktopMode() {
    if (inputMode === 'desktop') return;
    inputMode = 'desktop';
    joystickZone.style.display = 'none';
    lookZone.style.display = 'none';
    fireBtn.style.display = 'none';
    jumpBtn.style.display = 'none';
    aimBtn.style.display = 'none';
    reloadBtn.style.display = 'none';
    weaponBtn.style.display = 'none';
    vehicleBtn.style.display = 'none';
  }

  const gameKeyCodes = ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'Space', 'KeyR', 'KeyF', 'KeyG',
    'Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5', 'Digit6', 'Digit7'];
  function handleKeyDown(e) {
    enterDesktopMode();
    keys[e.code] = true;
    if (gameKeyCodes.includes(e.code)) e.preventDefault();
    if (e.code === 'Space') doJump();
    else if (e.code === 'KeyR') reload();
    else if (e.code === 'KeyF') { if (!e.repeat) toggleVehicleInteract(); }
    else if (e.code === 'KeyG') issueRallyCommand();
    else if (e.code.startsWith('Digit')) {
      const idx = parseInt(e.code.slice(5), 10) - 1;
      if (idx >= 0 && idx < weapons.length && !isDriving) {
        currentWeaponIndex = idx; rebuildGunModel(); fireCooldown = 0; player.reloading = false; updateHud();
      }
    }
  }
  function handleKeyUp(e) { keys[e.code] = false; }
  window.addEventListener('keydown', handleKeyDown);
  window.addEventListener('keyup', handleKeyUp);

  canvas.addEventListener('mousedown', (e) => {
    enterDesktopMode();
    canvas.focus();
    if (document.pointerLockElement !== canvas) canvas.requestPointerLock();
    if (e.button === 0) { firing = true; tryShoot(); }
    else if (e.button === 2) { aiming = true; }
  });
  window.addEventListener('mouseup', (e) => {
    if (e.button === 0) firing = false;
    else if (e.button === 2) { aiming = false; scopeOverlay.classList.remove('show'); }
  });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('mousemove', (e) => {
    if (inputMode !== 'desktop' || document.pointerLockElement !== canvas) return;
    
    const dx = (e.movementX || 0) * mouseSensitivity;
    const dy = (e.movementY || 0) * mouseSensitivity;
    
    if (isDriving && currentVehicle && currentVehicle.type === 'jet') {
      // 战斗机：鼠标直接控制飞机的偏航和俯仰，不涉及摄像机旋转
      // （摄像机已固定在机身后方，跟着飞机自动更新位置和指向）
      currentVehicle.yaw -= dx;                    // 水平转向
      currentVehicle.pitch -= dy;                   // 俯仰（上升/下降）
      currentVehicle.pitch = Math.max(-0.6, Math.min(0.6, currentVehicle.pitch));
    } else {
      // 普通步行/坦克：鼠标控制摄像机旋转
      yawObject.rotation.y -= dx;
      pitchObject.rotation.x -= dy;
      pitchObject.rotation.x = Math.max(-Math.PI / 2.3, Math.min(Math.PI / 2.3, pitchObject.rotation.x));
    }
  });
  canvas.addEventListener('wheel', (e) => {
    if (inputMode !== 'desktop') return;
    e.preventDefault();
    switchWeapon();
  }, { passive: false });

  function updateDesktopMove() {
    if (inputMode !== 'desktop') return;
    moveVec.y = (keys['KeyW'] ? -1 : 0) + (keys['KeyS'] ? 1 : 0);
    moveVec.x = (keys['KeyD'] ? 1 : 0) + (keys['KeyA'] ? -1 : 0);
  }

  // =========================================================
  // 主循环
  // =========================================================
  const clock = new THREE.Clock();
  const gravity = -14;
  let chunkTimer = 0;
  let elapsed = 0;
  let npcVehicleTimer = 3;

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    elapsed += dt;
    updateDesktopMove();
    updateVictoryCamera(dt);

    if (player.alive) {
     try {
      if (isDriving) {
        updateDriving(dt);
      } else {
        const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(yawObject.quaternion);
        const right = new THREE.Vector3(1, 0, 0).applyQuaternion(yawObject.quaternion);
        forward.y = 0; right.y = 0; forward.normalize(); right.normalize();

        const moveX = moveVec.x, moveZ = -moveVec.y;
        // 诺曼底地图：z 坐标小于滩头分界线视为还在深海/浅滩里，游泳状态下移速下降、视角贴近水面
        playerInWater = mapType === 'normandy' && yawObject.position.z < NORMANDY_BEACH_Z;
        // 柏林沼泽：人物移动速度降低 60%
        let speed = playerInWater ? 2.3 : 4.5;
        if (inBerlinSwamp(yawObject.position.x, yawObject.position.z)) speed *= 0.4;
        const moveDir = new THREE.Vector3();
        moveDir.addScaledVector(right, moveX).addScaledVector(forward, moveZ);
        if (moveDir.lengthSq() > 1) moveDir.normalize();

        const nextX = yawObject.position.x + moveDir.x * speed * dt;
        const nextZ = yawObject.position.z + moveDir.z * speed * dt;
        if (!collidesAt(nextX, yawObject.position.z, 0.4)) yawObject.position.x = nextX;
        if (!collidesAt(yawObject.position.x, nextZ, 0.4)) yawObject.position.z = nextZ;

        const groundHeight = getGroundHeight(yawObject.position.x, yawObject.position.z);
        player.velocityY += gravity * dt;
        yawObject.position.y += player.velocityY * dt;
        const eyeBase = groundHeight + (playerInWater ? playerHeight * 0.58 : playerHeight);
        if (yawObject.position.y <= eyeBase) {
          yawObject.position.y = eyeBase;
          player.velocityY = 0;
          player.onGround = true;
        }

        const playerMoving = moveDir.lengthSq() > 0.01;
        const pLegSwing = playerMoving ? Math.sin(elapsed * 8) * 0.5 : 0;
        playerMesh.userData.legL.rotation.x = pLegSwing;
        playerMesh.userData.legR.rotation.x = -pLegSwing;
        playerMesh.userData.bodyMesh.position.y = 1.15 + Math.sin(elapsed * 2.2) * 0.02;

        if (fireCooldown > 0) fireCooldown -= dt;
        if (firing && weapons[currentWeaponIndex].auto) tryShoot();

        const nearVehicle = findNearbyVehicle();
        if (inputMode !== 'desktop') vehicleBtn.style.display = nearVehicle ? 'block' : 'none';
      }

      updateBullets(dt);
      updateGrenades(dt);
      updateExplosions(dt);
      updateSmoke(dt);
      updateRagdolls(dt);
      updateSimpleDeaths(dt);
      updateRecoil(dt);
      updateControlPoints(dt);
      if (player.invulnerable) { player.invulnTimer -= dt; if (player.invulnTimer <= 0) player.invulnerable = false; }
      if (player.regenDelay > 0) {
        player.regenDelay -= dt;
      } else if (player.hp > 0 && player.hp < player.maxHp) {
        player.hp = Math.min(player.maxHp, player.hp + REGEN_RATE * dt);
        updateHud();
      }

      chunkTimer += dt;
      if (chunkTimer > 0.4) { chunkTimer = 0; if (!isBoundedMap()) updateChunks(); cullDistantCombatants(SPAWN_RADIUS_MAX + 35); }

      // 处理集结令排队的援军：之前这个队列只有入队没有出队，导致下达集结令后援军永远不会真正生成。
      // 这里分帧逐个把排队项转成真实友军，避免一次性 spawn 一堆角色导致瞬间卡顿
      pendingSpawnTimer -= dt;
      if (pendingSpawnTimer <= 0 && pendingFriendlySpawns.length > 0) {
        pendingSpawnTimer = 0.08;
        const item = pendingFriendlySpawns.shift();
        const { x, z } = randomPointNearControlPoint(item.cp);
        spawnFriendlyAt(x, z, item.rallying);
      }

      spawnTimer += dt;
      if (spawnTimer > spawnInterval) {
        spawnTimer = 0;
        if (spawnInterval > spawnIntervalFloor) spawnInterval -= 0.02;
        // 全图 NPC 总数（敌军+友军）硬性上限，防止人数无限堆叠导致场面失控/卡顿
        if (enemies.length + friendlies.length < maxTotalNpcs()) {
          // 斯大林格勒是敌众我寡的固守局，刷新时明显偏向敌方，制造持续的兵力压力
          const wantEnemy = mapType === 'stalingrad' ? Math.random() < 0.68 : Math.random() < 0.5;
          if (wantEnemy) {
            if (enemies.length < factionCap('red')) spawnEnemy();
            else if (friendlies.length < factionCap('blue')) spawnFriendly();
          } else {
            if (friendlies.length < factionCap('blue')) spawnFriendly();
            else if (enemies.length < factionCap('red')) spawnEnemy();
          }
        }
      }

      // 敌人 AI：优先与探测范围内的目标交战；若周围无威胁，则主动前往夺取据点
      // 性能优化：找最近目标本来是每帧对所有友军做一次全量扫描（O(N×M)），NPC 数量一多（如斯大林格勒/
      // 诺曼底的40人上限）这个开销会成倍放大。这里把"扫描找目标"节流成每 0.15~0.25 秒一次并错峰，
      // 中间的帧直接复用缓存目标、只重新算一次距离（O(1)），移动/开火逻辑完全不受影响
      enemies.forEach(enemy => {
        if (!enemy.alive || enemy.inVehicle) return;
        const ePos = enemy.mesh.position;
        const profile = npcWeaponProfiles[enemy.weaponType] || npcWeaponProfiles.rifle;

        enemy.targetScanTimer = (enemy.targetScanTimer || 0) - dt;
        if (enemy.targetScanTimer <= 0 || !enemy.cachedTarget) {
          enemy.targetScanTimer = 0.15 + Math.random() * 0.1;
          let bt = { kind: 'player', pos: yawObject.position, ref: null };
          let bd = Math.hypot(yawObject.position.x - ePos.x, yawObject.position.z - ePos.z);
          friendlies.forEach(f => {
            if (!f.alive || f.inVehicle) return;
            const d = Math.hypot(f.mesh.position.x - ePos.x, f.mesh.position.z - ePos.z);
            if (d < bd) { bd = d; bt = { kind: 'friendly', pos: f.mesh.position, ref: f }; }
          });
          enemy.cachedTarget = bt;
        }
        let target = enemy.cachedTarget;
        // 缓存目标可能在两次扫描之间已经死亡/上车，兜底退回玩家，避免瞄着一具尸体
        if (target.kind === 'friendly' && (!target.ref.alive || target.ref.inVehicle)) {
          target = enemy.cachedTarget = { kind: 'player', pos: yawObject.position, ref: null };
        }
        const bestDist = Math.hypot(target.pos.x - ePos.x, target.pos.z - ePos.z);

        // 斯大林格勒"围攻"模式：敌人不应该被远处一丝风吹草动钉在原地，而是要持续压向我方仅存的据点；
        // 只有真正进入武器射程（而非更宽的1.4倍侦测范围）才会停下交火，其余时候都朝最近的蓝方据点推进
        const isSiegeMap = mapType === 'stalingrad';
        const detectRange = isSiegeMap ? profile.range : profile.range * 1.4;
        let moving = false;

        if (bestDist <= detectRange) {
          const dx = target.pos.x - ePos.x, dz = target.pos.z - ePos.z;
          const dist = bestDist;
          if (dist > 0.01) enemy.mesh.rotation.y = Math.atan2(-dx, -dz); // 与玩家摄像机方向公式保持一致

          const preferredMin = profile.prefMin, preferredMax = profile.prefMax;
          if (dist > preferredMax) {
            steerTowards(ePos, dx, dz, dist, enemy.speed, dt);
            moving = true;
          } else if (dist < preferredMin) {
            steerTowards(ePos, -dx, -dz, dist, enemy.speed * 0.8, dt);
            moving = true;
          }
          updateCharacterVisuals(enemy, moving, dt);

          if (dist < profile.range) {
            enemy.fireCooldown -= dt;
            if (enemy.fireCooldown <= 0) {
              const eyePos = new THREE.Vector3(ePos.x, ePos.y + 1.6, ePos.z);
              const targetEyePos = target.kind === 'player' ? yawObject.position : new THREE.Vector3(target.pos.x, target.pos.y + 1.5, target.pos.z);
              if (hasLineOfSight(eyePos, targetEyePos)) {
              enemy.gunKick = 1;
              enemy.mesh.userData.muzzleLight.intensity = 2.2;
              const gunWorldPos = new THREE.Vector3();
              enemy.mesh.userData.gunMesh.getWorldPosition(gunWorldPos);
              if (profile.isExplosive) {
                const jitter = 0.03 + dist * 0.004;
                const aimAt = new THREE.Vector3(target.pos.x, target.pos.y, target.pos.z)
                  .add(new THREE.Vector3((Math.random() - 0.5) * dist * jitter, 0, (Math.random() - 0.5) * dist * jitter));
                npcThrowExplosive(gunWorldPos, aimAt, profile);
              } else {
              const hitChance = Math.max(0.15, Math.min(profile.accBase, profile.accBase - dist * profile.accFalloff));
              const isHit = Math.random() < hitChance;
              const targetY = target.kind === 'player' ? yawObject.position.y - 0.2 : target.pos.y + 1.1;
              const aimAt = new THREE.Vector3(target.pos.x, targetY, target.pos.z);
              const targetPoint = isHit
                ? aimAt.clone().add(new THREE.Vector3((Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.3))
                : aimAt.clone().add(new THREE.Vector3((Math.random() - 0.5) * 3.4, (Math.random() - 0.5) * 2.2, (Math.random() - 0.5) * 3.4));
              spawnBullet(gunWorldPos, targetPoint, 0xff5533, 75);
              if (isHit) {
                const dmg = profile.dmgMin + Math.random() * (profile.dmgMax - profile.dmgMin);
                if (target.kind === 'player') damageEntity('player', null, dmg);
                else damageEntity('friendly', target.ref, dmg, new THREE.Vector3(dx, 0, dz).normalize());
              }
              }
              // 连发状态机：打完一梭子（burstSize 发）才进入长冷却，梭内每发间隔极短
              if (profile.burst) {
                if (enemy.burstLeft > 0) {
                  enemy.burstLeft--;
                  enemy.fireCooldown = enemy.burstLeft > 0 ? profile.burstInterval : profile.fireMin + Math.random() * (profile.fireMax - profile.fireMin);
                } else {
                  enemy.burstLeft = profile.burstSize - 1;
                  enemy.fireCooldown = profile.burstInterval;
                }
              } else {
                enemy.fireCooldown = profile.fireMin + Math.random() * (profile.fireMax - profile.fireMin);
              }
              }
            }
          }
        } else {
          // 附近没有真正进入射程的威胁：主动向前推进围攻距离最近的蓝方（我方）据点，
          // 斯大林格勒地图上这就是玩家仅存的2个据点——始终压向那里，不会原地打转
          const cp = findNearestCapturablePoint(ePos, 'red');
          if (cp) {
            const dx = cp.x - ePos.x, dz = cp.z - ePos.z;
            const dist = Math.hypot(dx, dz);
            if (dist > 0.01) enemy.mesh.rotation.y = Math.atan2(-dx, -dz); // 与玩家摄像机方向公式保持一致
            if (dist > CAPTURE_RADIUS * 0.5) {
              steerTowards(ePos, dx, dz, dist, enemy.speed * (isSiegeMap ? 1.15 : 1), dt);
              moving = true;
            }
          }
          updateCharacterVisuals(enemy, moving, dt);
        }
      });
      for (let i = enemies.length - 1; i >= 0; i--) { if (!enemies[i].alive) enemies.splice(i, 1); }

      // 友军 AI：处于集结状态则始终赶赴目标据点(边走边打)；否则按常规逻辑优先攻击最近的敌人，否则跟随玩家
      // 同样把"扫描找最近敌人"节流成每 0.15~0.25 秒一次并错峰，中间帧复用缓存目标
      friendlies.forEach(f => {
        if (!f.alive || f.inVehicle) return;
        const fPos = f.mesh.position;
        const fProfile = npcWeaponProfiles[f.weaponType] || npcWeaponProfiles.rifle;

        f.targetScanTimer = (f.targetScanTimer || 0) - dt;
        if (f.targetScanTimer <= 0 || f.cachedEnemy === undefined) {
          f.targetScanTimer = 0.15 + Math.random() * 0.1;
          let ne = null, bd = Infinity;
          enemies.forEach(en => {
            if (!en.alive || en.inVehicle) return;
            const d = Math.hypot(en.mesh.position.x - fPos.x, en.mesh.position.z - fPos.z);
            if (d < bd) { bd = d; ne = en; }
          });
          f.cachedEnemy = ne;
        }
        let nearestEnemy = (f.cachedEnemy && f.cachedEnemy.alive && !f.cachedEnemy.inVehicle) ? f.cachedEnemy : null;
        const bestDist = nearestEnemy ? Math.hypot(nearestEnemy.mesh.position.x - fPos.x, nearestEnemy.mesh.position.z - fPos.z) : Infinity;

        // 集结状态自动解除条件：据点已到手 / 集结令已清空 / 已经抵达据点
        if (f.rallying) {
          if (!rallyPoint || rallyPoint.owner === 'blue') f.rallying = false;
          else if (Math.hypot(rallyPoint.x - fPos.x, rallyPoint.z - fPos.z) < CAPTURE_RADIUS * 0.35) f.rallying = false;
        }

        if (f.rallying) {
          const dx = rallyPoint.x - fPos.x, dz = rallyPoint.z - fPos.z;
          const dist = Math.hypot(dx, dz);
          let moving = false;
          if (dist > 0.01) f.mesh.rotation.y = Math.atan2(dx, dz);
          if (dist > CAPTURE_RADIUS * 0.35) {
            steerTowards(fPos, dx, dz, dist, f.speed * 1.15, dt);
            moving = true;
          }
          // 边走边射击：射程内有敌人就开火，不为了保持交战距离而停下脚步
          if (nearestEnemy && bestDist < fProfile.range) {
            f.fireCooldown -= dt;
            if (f.fireCooldown <= 0) {
              const eyePos = new THREE.Vector3(fPos.x, fPos.y + 1.6, fPos.z);
              const targetEyePos = new THREE.Vector3(nearestEnemy.mesh.position.x, nearestEnemy.mesh.position.y + 1.5, nearestEnemy.mesh.position.z);
              if (hasLineOfSight(eyePos, targetEyePos)) {
                f.gunKick = 1;
                f.mesh.userData.muzzleLight.intensity = 2.2;
                const gunWorldPos = new THREE.Vector3();
                f.mesh.userData.gunMesh.getWorldPosition(gunWorldPos);
                const edx = nearestEnemy.mesh.position.x - fPos.x, edz = nearestEnemy.mesh.position.z - fPos.z;
                if (fProfile.isExplosive) {
                  const jitter = 0.03 + bestDist * 0.004;
                  const aimAt = new THREE.Vector3(nearestEnemy.mesh.position.x, nearestEnemy.mesh.position.y, nearestEnemy.mesh.position.z)
                    .add(new THREE.Vector3((Math.random() - 0.5) * bestDist * jitter, 0, (Math.random() - 0.5) * bestDist * jitter));
                  npcThrowExplosive(gunWorldPos, aimAt, fProfile);
                } else {
                  const hitChance = Math.max(0.15, Math.min(fProfile.accBase, fProfile.accBase - bestDist * fProfile.accFalloff));
                  const isHit = Math.random() < hitChance;
                  const aimAt = new THREE.Vector3(nearestEnemy.mesh.position.x, nearestEnemy.mesh.position.y + 1.1, nearestEnemy.mesh.position.z);
                  const targetPoint = isHit
                    ? aimAt.clone().add(new THREE.Vector3((Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.3))
                    : aimAt.clone().add(new THREE.Vector3((Math.random() - 0.5) * 3, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 3));
                  spawnBullet(gunWorldPos, targetPoint, 0x66ff99, 85);
                  if (isHit) damageEntity('enemy', nearestEnemy, fProfile.dmgMin + Math.random() * (fProfile.dmgMax - fProfile.dmgMin), new THREE.Vector3(edx, 0, edz).normalize());
                }
                if (fProfile.burst) {
                  if (f.burstLeft > 0) {
                    f.burstLeft--;
                    f.fireCooldown = f.burstLeft > 0 ? fProfile.burstInterval : fProfile.fireMin + Math.random() * (fProfile.fireMax - fProfile.fireMin);
                  } else {
                    f.burstLeft = fProfile.burstSize - 1;
                    f.fireCooldown = fProfile.burstInterval;
                  }
                } else {
                  f.fireCooldown = fProfile.fireMin + Math.random() * (fProfile.fireMax - fProfile.fireMin);
                }
              }
            }
          }
          updateCharacterVisuals(f, moving, dt);
          return;
        }

        if (nearestEnemy && bestDist < Math.max(30, fProfile.range)) {
          const dx = nearestEnemy.mesh.position.x - fPos.x, dz = nearestEnemy.mesh.position.z - fPos.z;
          const dist = bestDist;
          if (dist > 0.01) f.mesh.rotation.y = Math.atan2(dx, dz);
          const preferredMin = fProfile.prefMin, preferredMax = fProfile.prefMax;
          if (dist > preferredMax) {
            steerTowards(fPos, dx, dz, dist, f.speed, dt);
            moving = true;
          } else if (dist < preferredMin) {
            steerTowards(fPos, -dx, -dz, dist, f.speed * 0.8, dt);
            moving = true;
          }
          if (dist < fProfile.range) {
          f.fireCooldown -= dt;
          if (f.fireCooldown <= 0) {
            const eyePos = new THREE.Vector3(fPos.x, fPos.y + 1.6, fPos.z);
            const targetEyePos = new THREE.Vector3(nearestEnemy.mesh.position.x, nearestEnemy.mesh.position.y + 1.5, nearestEnemy.mesh.position.z);
            if (hasLineOfSight(eyePos, targetEyePos)) {
            f.gunKick = 1;
            f.mesh.userData.muzzleLight.intensity = 2.2;
            const gunWorldPos = new THREE.Vector3();
            f.mesh.userData.gunMesh.getWorldPosition(gunWorldPos);
            if (fProfile.isExplosive) {
              const jitter = 0.03 + dist * 0.004;
              const aimAt = new THREE.Vector3(nearestEnemy.mesh.position.x, nearestEnemy.mesh.position.y, nearestEnemy.mesh.position.z)
                .add(new THREE.Vector3((Math.random() - 0.5) * dist * jitter, 0, (Math.random() - 0.5) * dist * jitter));
              npcThrowExplosive(gunWorldPos, aimAt, fProfile);
            } else {
            const hitChance = Math.max(0.15, Math.min(fProfile.accBase, fProfile.accBase - dist * fProfile.accFalloff));
            const isHit = Math.random() < hitChance;
            const aimAt = new THREE.Vector3(nearestEnemy.mesh.position.x, nearestEnemy.mesh.position.y + 1.1, nearestEnemy.mesh.position.z);
            const targetPoint = isHit
              ? aimAt.clone().add(new THREE.Vector3((Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.3, (Math.random() - 0.5) * 0.3))
              : aimAt.clone().add(new THREE.Vector3((Math.random() - 0.5) * 3, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 3));
            spawnBullet(gunWorldPos, targetPoint, 0x66ff99, 85);
            if (isHit) damageEntity('enemy', nearestEnemy, fProfile.dmgMin + Math.random() * (fProfile.dmgMax - fProfile.dmgMin), new THREE.Vector3(dx, 0, dz).normalize());
            }
            if (fProfile.burst) {
              if (f.burstLeft > 0) {
                f.burstLeft--;
                f.fireCooldown = f.burstLeft > 0 ? fProfile.burstInterval : fProfile.fireMin + Math.random() * (fProfile.fireMax - fProfile.fireMin);
              } else {
                f.burstLeft = fProfile.burstSize - 1;
                f.fireCooldown = fProfile.burstInterval;
              }
            } else {
              f.fireCooldown = fProfile.fireMin + Math.random() * (fProfile.fireMax - fProfile.fireMin);
            }
            }
          }
          }
        } else {
          const cp = (rallyPoint && rallyPoint.owner !== 'blue') ? rallyPoint : findNearestCapturablePoint(fPos, 'blue');
          if (cp) {
            const dx = cp.x - fPos.x, dz = cp.z - fPos.z;
            const dist = Math.hypot(dx, dz);
            if (dist > 0.01) f.mesh.rotation.y = Math.atan2(dx, dz);
            if (dist > CAPTURE_RADIUS * 0.5) {
              steerTowards(fPos, dx, dz, dist, f.speed, dt);
              moving = true;
            }
          } else {
            const followX = yawObject.position.x + Math.cos(f.followAngle) * 6;
            const followZ = yawObject.position.z + Math.sin(f.followAngle) * 6;
            const dx = followX - fPos.x, dz = followZ - fPos.z;
            const dist = Math.hypot(dx, dz);
            if (dist > 2) {
              steerTowards(fPos, dx, dz, dist, f.speed, dt);
              f.mesh.rotation.y = Math.atan2(dx, dz);
              moving = true;
            }
          }
        }
        updateCharacterVisuals(f, moving, dt);
      });
      for (let i = friendlies.length - 1; i >= 0; i--) { if (!friendlies[i].alive) friendlies.splice(i, 1); }

      // 诺曼底内陆是起伏地形：AI 的 x/z 移动是在 steerTowards 里单独算的，不会顺带更新高度，
      // 这里统一补一遍，让士兵贴着地形起伏走，而不是固定停留在出生时的高度上
      if (mapType === 'normandy') {
        enemies.forEach(en => { if (en.alive && !en.inVehicle) en.mesh.position.y = getGroundHeight(en.mesh.position.x, en.mesh.position.z); });
        friendlies.forEach(f => { if (f.alive && !f.inVehicle) f.mesh.position.y = getGroundHeight(f.mesh.position.x, f.mesh.position.z); });
      }

      // NPC 偶尔就近登上无人载具，成为可驾驶的移动火力点（快艇走专属摆渡逻辑，这里排除掉）
      npcVehicleTimer -= dt;
      if (npcVehicleTimer <= 0) {
        npcVehicleTimer = 3 + Math.random() * 2;
        [...enemies, ...friendlies].forEach(npc => {
          if (!npc.alive || npc.inVehicle) return;
          for (const v of vehicles) {
            if (v.occupant || v.type === 'speedboat') continue;
            const d = Math.hypot(v.mesh.position.x - npc.mesh.position.x, v.mesh.position.z - npc.mesh.position.z);
            if (d < 5 && Math.random() < 0.4) {
              const list = enemies.includes(npc) ? 'enemy' : 'friendly';
              v.occupant = { list, ref: npc };
              npc.vehicle = v; npc.inVehicle = true;
              npc.mesh.visible = false;
              break;
            }
          }
        });
      }

      // 载具更新：玩家驾驶 or NPC 自动驾驶（快艇不参与这套"追击战斗"AI，走下面专属的摆渡状态机）
      vehicles.forEach(v => {
        if (v.type === 'speedboat') return;
        if (v.occupant && v.occupant.list === 'player') return; // 由 updateDriving 统一处理
        if (v.occupant && v.occupant.list) updateVehicleAuto(v, dt);
      });
      if (mapType === 'normandy') updateNormandyFerry(dt);
     } catch (err) {
      console.error('frame update error:', err);
     }
    }

    // 兜底检查：无论血量是被哪条路径扣到 0 以下，都保证结算画面一定弹出
    if (player.hp <= 0 && player.alive) { player.hp = 0; gameOver(); }

    renderer.render(scene, camera);
  }

  // =========================================================
  // 地图选择：等待玩家选定地图类型后再生成地形/单位并开始渲染循环
  // =========================================================
  let gameStarted = false;
  function startGame(selectedType) {
    if (gameStarted) return;
    gameStarted = true;
    mapType = selectedType;
    document.getElementById('mapSelect').style.display = 'none';

    if (mapType === 'stalingrad') {
      generateStalingrad();
      yawObject.position.set(mazeOrigin.x + mazeCellSize / 2, playerHeight, mazeOrigin.z + mazeCellSize / 2);
      scene.background = new THREE.Color(0x8a8a86);
      scene.fog = new THREE.Fog(0x8a8a86, 16, 62);
      hemi.color.set(0xaaaaaa); hemi.groundColor.set(0x555550); hemi.intensity = 0.7;
      sun.color.set(0xcfcfcf); sun.intensity = 0.55;
      spawnInterval = 0.5;
      spawnIntervalFloor = 0.25;
    } else if (mapType === 'berlin') {
      generateBerlin();
      yawObject.position.set((Math.random() - 0.5) * 30, 0, BERLIN_SPAWN_Z);
      yawObject.position.y = getGroundHeight(yawObject.position.x, yawObject.position.z) + playerHeight;
      // 与诺曼底/斯大林格勒统一的灰色基调
      scene.background = new THREE.Color(0x8a8a86);
      scene.fog = new THREE.Fog(0x8a8a86, 18, 70);
      hemi.color.set(0xaaaaaa); hemi.groundColor.set(0x555550); hemi.intensity = 0.7;
      sun.color.set(0xcfcfcf); sun.intensity = 0.55;
      spawnInterval = 0.9;   // 柏林敌人刷新密度降低
      spawnIntervalFloor = 0.45;
    } else if (mapType === 'normandy') {
      generateNormandy();
      yawObject.position.set((Math.random() - 0.5) * 6, NORMANDY_DECK_H + playerHeight, NORMANDY_SHIP_Z - 2);
      scene.background = new THREE.Color(0x8a8a86);
      scene.fog = new THREE.Fog(0x8a8a86, 16, 58);
      hemi.color.set(0xaaaaaa); hemi.groundColor.set(0x555550); hemi.intensity = 0.7;
      sun.color.set(0xcfcfcf); sun.intensity = 0.55;
      spawnInterval = 0.9;   // 柏林敌人刷新密度降低
      spawnIntervalFloor = 0.45;
    } else {
      updateChunks();
      scene.fog = new THREE.Fog(0x8fc7ff, 26, mapType === 'mountains' ? 130 : 95);
      yawObject.position.y = getGroundHeight(yawObject.position.x, yawObject.position.z) + playerHeight;
    }

    if (mapType === 'berlin') {
      // 柏林：我方与20辆坦克一同在集结线出发，横向排开成突击阵列。
      // 其中中路 3 辆留空给玩家自己开，其余 17 辆开局就配友军车组，
      // 保证大部队会真正开动向北推进，而不是空车停在原地等 NPC 路过时随机上车。
      const PLAYER_TANK_SLOTS = [4, 5, 15]; // 前排中央2辆 + 后排中央1辆
      for (let i = 0; i < 20; i++) {
        const lane = (i % 10 - 4.5) * 11;      // 每排10辆，横向铺开
        const row = Math.floor(i / 10);         // 两排
        const tx = lane + (Math.random() - 0.5) * 3;
        const tz = BERLIN_SPAWN_Z + 4 + row * 9;
        spawnVehicleAt(tx, tz, 'tank');
        const tank = vehicles[vehicles.length - 1];
        if (PLAYER_TANK_SLOTS.includes(i)) continue; // 空车，留给玩家
        const crew = spawnFriendlyAt(tx, tz, false);
        if (crew) {
          tank.occupant = { list: 'friendly', ref: crew };
          crew.vehicle = tank;
          crew.inVehicle = true;
          crew.mesh.visible = false; // 人已在车内，隐藏步行模型
        }
      }
    } else if (mapType === 'normandy') {
      // 诺曼底不用通用的随机载具生成：在战舰旁一字排开放 3 艘快艇，内陆再放1辆吉普+1辆坦克供抢滩后使用
      const boatLanesX = [-14, 0, 14];
      boatLanesX.forEach(bx => {
        spawnVehicleAt(bx, NORMANDY_BOAT_SPAWN_Z, 'speedboat');
        const boat = vehicles[vehicles.length - 1];
        boat.ferryState = 'loading';
        boat.ferryTimer = 0;
        boat.homeX = bx;
        boat.dockX = bx;
        normandyBoats.push(boat);
      });
      spawnVehicleAt((Math.random() - 0.5) * NORMANDY_HALF_W, NORMANDY_LAND_Z + 10, 'jeep');
      spawnVehicleAt((Math.random() - 0.5) * NORMANDY_HALF_W, NORMANDY_LAND_Z + 16, 'tank');
    } else {
      const spots = [randomSpawnPoint(), randomSpawnPoint(), randomSpawnPoint(), randomSpawnPoint()];
      spawnVehicleAt(spots[0].x, spots[0].z, 'jeep');
      spawnVehicleAt(spots[1].x, spots[1].z, 'jeep');
      spawnVehicleAt(spots[2].x, spots[2].z, 'tank');
      if (!isBoundedMap()) spawnVehicleAt(spots[3].x, spots[3].z, 'jet');
    }

    generateControlPoints();

    for (let i = 0; i < 3; i++) spawnFriendly();

    animate();
  }
  document.querySelectorAll('#mapSelect [data-map]').forEach(btn => {
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); startGame(btn.dataset.map); }, { passive: false });
    btn.addEventListener('click', () => startGame(btn.dataset.map));
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  document.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });
}
</script>
</body>
</html>
